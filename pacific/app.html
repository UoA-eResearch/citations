<title>Vā Atlas of Pacific Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen night-sea chart. Header bar; stage (map / genealogy / text pages) with a detail
   panel on the right; the "tide" timeline along the foot drives time in the map and genealogy. */
:root {
  color-scheme: dark;
  --sea: #0b1620;      /* ground: night ocean */
  --sea-1: #10202b;    /* panels */
  --sea-2: #173341;    /* raised, hover */
  --rule: #24414e;     /* hairlines */
  --ink: #f0f4f1;
  --ink-2: #c6d4d6;   /* 12:1 on --sea */
  --ink-3: #98aeb3;   /* 7.9:1 on --sea, 7.2:1 on --sea-1 */
  --land: #1b2e35;
  --coast: #34535d;
  --star: #f2d48f;     /* accent: starlight - selection, main path, events */
  --star-ink: #1c1606;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --other: #5d7479;
  --f-display: "Alegreya", "Iowan Old Style", Georgia, serif;
  --f-ui: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --step--1: 0.875rem; --step-0: 1rem; --step-1: 1.1875rem; --step-2: 1.5rem; --step-3: 2.25rem;
  --panel-w: 400px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--sea); color: var(--ink);
  font: 400 var(--step-0)/1.45 var(--f-ui);
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); overflow: hidden;
}
a { color: var(--star); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--star); outline-offset: 2px; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
header.bar {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--sea);
  position: relative; z-index: 5;
}
.brand { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand b { font: 700 var(--step-2)/1 var(--f-display); letter-spacing: 0.01em; }
.brand b i { font-style: italic; font-weight: 500; color: var(--star); }
.brand span { font-size: var(--step--1); color: var(--ink-3); letter-spacing: 0.02em; }
nav.tabs { display: flex; gap: 2px; background: var(--sea-1); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; overflow-x: auto; max-width: 100%; min-width: 0; }
nav.tabs button {
  background: none; border: 0; padding: 5px 12px; border-radius: 6px; color: var(--ink-2); white-space: nowrap;
  font-weight: 500;
}
nav.tabs button[aria-selected="true"] { background: var(--sea-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--star); }
.search { position: relative; margin-left: auto; flex: 0 1 300px; min-width: 180px; }
.search input {
  width: 100%; background: var(--sea-1); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px;
}
.search input::placeholder { color: var(--ink-3); }
.results {
  position: absolute; right: 0; top: calc(100% + 6px); width: min(440px, 92vw); max-height: 60vh; overflow: auto;
  background: var(--sea-1); border: 1px solid var(--rule); border-radius: 10px; padding: 6px; z-index: 20;
  box-shadow: 0 18px 40px rgba(0,0,0,0.45);
}
.results h4 { margin: 8px 8px 4px; font: 500 var(--step--1)/1 var(--f-ui); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; }
.results button:hover, .results button:focus-visible { background: var(--sea-2); }
.results small { color: var(--ink-3); }
.tour-btn { background: var(--star); color: var(--star-ink); border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; }

/* ---------- stage ---------- */
main { position: relative; display: grid; grid-template-columns: 1fr var(--panel-w); min-height: 0; }
main.no-panel { grid-template-columns: 1fr 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.view { position: absolute; inset: 0; }
.view[hidden] { display: none !important; }
.page { overflow-y: auto; padding-block: 28px 48px; padding-inline: max(16px, 4vw); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-family: var(--f-display); font-size: var(--step-1); font-style: italic; }

.overlay {
  position: absolute; z-index: 3; background: color-mix(in oklab, var(--sea-1) 92%, transparent);
  border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px);
}
.ctl { top: 14px; left: 14px; width: 292px; max-height: calc(100% - 28px); overflow: auto; }
.ctl h3, .panel h3 { margin: 0 0 8px; font: 600 0.8125rem/1.2 var(--f-ui); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.ctl .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; color: var(--ink-2); }
.ctl label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.ctl input[type=checkbox] { accent-color: var(--star); }
.swatch { width: 18px; height: 4px; border-radius: 2px; flex: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--s5); flex: none; }
.diamond { width: 9px; height: 9px; background: var(--star); transform: rotate(45deg); flex: none; margin-inline: 1px; }
.seg { display: inline-flex; background: var(--sea); border: 1px solid var(--rule); border-radius: 7px; padding: 2px; }
.seg button { background: none; border: 0; padding: 3px 10px; border-radius: 5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--sea-2); color: var(--ink); }
.note { font-size: var(--step--1); color: var(--ink-3); margin: 8px 0 0; }
.legend-list { display: grid; gap: 2px; margin-top: 6px; }
.legend-list button {
  display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; text-align: left;
  background: none; border: 0; border-radius: 6px; padding: 3px 4px; color: var(--ink-2); font-size: var(--step--1);
}
.legend-list button:hover, .legend-list button[aria-pressed="true"] { background: var(--sea-2); color: var(--ink); }
.legend-list button span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  border: 1px solid var(--rule); background: none; border-radius: 999px; padding: 1px 9px; font-size: var(--step--1); color: var(--ink-2);
}
.chip[aria-pressed="true"] { border-color: var(--star); color: var(--ink); background: color-mix(in oklab, var(--star) 14%, transparent); }
.caption { left: 14px; bottom: 14px; max-width: 520px; font-size: var(--step--1); color: var(--ink-2); }

/* ---------- detail panel ---------- */
.panel { border-left: 1px solid var(--rule); background: var(--sea-1); overflow-y: auto; min-width: 0; padding: 18px 18px 40px; position: relative; }
main.no-panel .panel { display: none; }
.panel .close { position: absolute; top: 10px; right: 10px; background: none; border: 1px solid var(--rule); border-radius: 6px; color: var(--ink-3); width: 28px; height: 28px; }
.panel .kind { font-size: var(--step--1); color: var(--star); text-transform: uppercase; letter-spacing: 0.08em; }
.panel h2 { font: 500 var(--step-2)/1.15 var(--f-display); margin: 4px 30px 6px 0; text-wrap: balance; }
.panel .meta { color: var(--ink-2); margin: 0 0 12px; }
.panel section { margin-top: 18px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 12px 0; }
.facts div { border-top: 1px solid var(--rule); padding-top: 6px; }
.facts b { display: block; font: 500 var(--step-1)/1.1 var(--f-ui); }
.facts span { font-size: var(--step--1); color: var(--ink-3); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.list button, .list a.item {
  display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 6px; color: var(--ink);
  text-decoration: none;
}
.list button:hover, .list button:focus-visible { background: var(--sea-2); }
.list small { color: var(--ink-3); display: block; font-size: var(--step--1); }
.abstract { color: var(--ink-2); font-size: 0.9375rem; line-height: 1.6; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.btn { background: var(--sea-2); border: 1px solid var(--rule); border-radius: 7px; padding: 5px 10px; color: var(--ink); text-decoration: none; font-size: var(--step--1); }
.btn.on { background: var(--star); color: var(--star-ink); border-color: var(--star); font-weight: 700; }
.empty-panel h2 { font-style: italic; }
.empty-panel p { color: var(--ink-2); }

/* ---------- tide timeline ---------- */
footer.tide {
  display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 14px;
  border-top: 1px solid var(--rule); padding: 8px 16px 10px; background: var(--sea);
}
footer.tide[hidden] { display: none; }
.play { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--star); background: none; color: var(--star); font-size: 15px; }
.yearread { display: flex; flex-direction: column; line-height: 1.05; min-width: 112px; }
.yearread b { font: 500 var(--step-2)/1 var(--f-data); }
.yearread span { font-size: var(--step--1); color: var(--ink-3); }
#tideChart { width: 100%; height: 64px; display: block; cursor: ew-resize; touch-action: none; }

/* ---------- pages (thinkers, coverage, about) ---------- */
.page h1 { font: 500 var(--step-3)/1.1 var(--f-display); margin: 0 0 8px; text-wrap: balance; max-width: 26ch; }
.page h2 { font: 500 var(--step-2)/1.2 var(--f-display); margin: 36px 0 8px; text-wrap: balance; }
.page p.lead { font-size: var(--step-1); color: var(--ink-2); max-width: 68ch; margin: 0 0 18px; }
.page p { max-width: 68ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 18px 0; }
.tile { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sea-1); }
.tile b { display: block; font: 500 var(--step-3)/1 var(--f-ui); }
.tile span { color: var(--ink-2); font-size: var(--step--1); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0; }
.toolbar input, .toolbar select { background: var(--sea-1); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: middle; }
th { color: var(--ink-3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; background: var(--sea-1); position: sticky; top: 0; }
th button { background: none; border: 0; padding: 0; color: inherit; text-transform: inherit; letter-spacing: inherit; font-weight: inherit; }
th button[aria-sort] { color: var(--ink); }
td small, .shortlist small, .results small { font-size: 0.8125rem; }
td.num { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:hover { background: var(--sea-1); }
td .name { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 500; text-align: left; }
td .name:hover { color: var(--star); }
.pct { display: grid; grid-template-columns: 54px auto; align-items: center; gap: 6px; }
.pct i { display: block; height: 6px; border-radius: 3px; background: var(--rule); position: relative; overflow: hidden; }
.pct i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--s1); border-radius: 3px; }
.pct.bt i::after { background: var(--s3); }
.sl { display: inline-flex; gap: 4px; }
.sl button { border: 1px solid var(--rule); background: none; border-radius: 6px; padding: 1px 7px; color: var(--ink-3); font-size: 12px; }
.sl button[aria-pressed="true"] { background: var(--star); border-color: var(--star); color: var(--star-ink); font-weight: 700; }
.lens { display: flex; gap: 8px; flex-wrap: wrap; }
.lens button { text-align: left; border: 1px solid var(--rule); background: var(--sea-1); border-radius: 10px; padding: 9px 12px; max-width: 290px; display: flex; flex-direction: column; justify-content: flex-start; gap: 2px; }
.lens button b { display: block; }
.lens button span { color: var(--ink-3); font-size: var(--step--1); }
.lens button[aria-pressed="true"] { border-color: var(--star); box-shadow: inset 0 0 0 1px var(--star); }
.shortlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 14px 0; }
.shortlist > div { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sea-1); min-width: 0; }
.shortlist h3 { margin: 0 0 6px; font: 500 var(--step-1)/1.2 var(--f-display); }
.shortlist ol { margin: 6px 0 0; padding-left: 20px; color: var(--ink-2); }
.pill { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 12px; border: 1px solid var(--rule); white-space: nowrap; }
.pill.ok { border-color: color-mix(in oklab, var(--s3) 70%, transparent); color: #7fd6b3; }
.pill.miss { border-color: color-mix(in oklab, var(--s2) 70%, transparent); color: #f0a07e; }
.bars { display: grid; grid-template-columns: minmax(110px, 180px) 1fr; gap: 6px 10px; align-items: center; max-width: 640px; font-size: var(--step--1); }
.bars span { color: var(--ink-2); }
.bars i { display: block; height: 12px; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.bars em { font-style: normal; font-family: var(--f-data); color: var(--ink-2); margin-left: 6px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; }
.cols > div { min-width: 0; }
pre.schema { background: var(--sea-1); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font: 12.5px/1.5 var(--f-data); color: var(--ink-2); }
.steps { counter-reset: s; list-style: none; padding: 0; display: grid; gap: 12px; max-width: 760px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
.steps li::before { content: counter(s); font: 500 var(--step-1)/1 var(--f-data); color: var(--star); border: 1px solid var(--rule); border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; }
.steps b { display: block; }
.steps span { color: var(--ink-2); }

/* ---------- tour ---------- */
.tour { right: calc(var(--panel-w) + 14px); bottom: 98px; width: min(360px, calc(100% - 28px)); z-index: 30; position: fixed; }
main.no-panel ~ .tour { right: 14px; }
.tour .k { color: var(--star); font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.08em; }
.tour h3 { font: 500 var(--step-1)/1.2 var(--f-display); margin: 4px 0 6px; text-transform: none; letter-spacing: 0; color: var(--ink); }
.tour p { margin: 0; color: var(--ink-2); font-size: var(--step--1); }

.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--star); color: var(--star-ink); padding: 8px 14px; border-radius: 8px; font-weight: 500; z-index: 40; }

@media (max-width: 900px) {
  :root { --panel-w: 100%; }
  body { overflow: auto; }
  main, main.no-panel { grid-template-columns: 1fr; grid-template-rows: minmax(420px, 62vh) auto; }
  .panel { border-left: 0; border-top: 1px solid var(--rule); max-height: none; }
  .ctl { width: auto; right: 14px; max-height: 44%; }
  .tour { right: 14px; left: 14px; width: auto; bottom: 14px; }
  .search { order: 3; flex-basis: 100%; margin-left: 0; min-width: 0; }
  .brand { flex: 1 1 100%; }
  .brand span { overflow-wrap: anywhere; }
  footer.tide { grid-template-columns: auto 1fr; }
  footer.tide .yearread { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="bar">
  <div class="brand"><b>V<i>ā</i> Atlas</b><span>Pacific Research Methodologies</span></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-view="map" aria-selected="true">Vā map</button>
    <button role="tab" data-view="gen" aria-selected="false">Genealogy</button>
    <button role="tab" data-view="people" aria-selected="false">Key thinkers</button>
    <button role="tab" data-view="gaps" aria-selected="false">What's missing</button>
    <button role="tab" data-view="about" aria-selected="false">About</button>
  </nav>
  <div class="search">
    <input id="q" type="search" placeholder="Find a scholar, work or institution" autocomplete="off" aria-label="Search">
    <div class="results" id="results" hidden></div>
  </div>
  <button class="tour-btn" id="tourBtn">Guided tour</button>
</header>

<main id="main">
  <div class="stage">
    <div class="loading" id="loading">Gathering the sea of islands…</div>

    <!-- Vā map -->
    <div class="view" id="v-map">
      <div id="mapCanvas" style="position:absolute;inset:0"></div>
      <div class="overlay ctl" id="mapCtl">
        <h3>Vā relations</h3>
        <div class="row"><label><input type="checkbox" id="lyInst" checked> <span class="dot" style="background:var(--s3)"></span> Institutions <small class="mono" style="color:var(--ink-3)">size = works</small></label></div>
        <div class="row"><label><input type="checkbox" id="lyCollab" checked> <span class="swatch" style="background:var(--s1)"></span> Co-authorship ties</label></div>
        <div class="row"><label><input type="checkbox" id="lyFlow"> <span class="swatch" style="background:linear-gradient(90deg, color-mix(in oklab,var(--s2) 25%,transparent), var(--s2))"></span> Citation flows</label></div>
        <div class="row"><label><input type="checkbox" id="lyColoc" checked> <span class="ring"></span> Co-locations of key scholars</label></div>
        <div class="row"><label><input type="checkbox" id="lyEvents" checked> <span class="diamond"></span> Events</label></div>
        <div class="row" style="margin-top:10px"><span>Ties</span>
          <div class="seg" role="group" aria-label="Which ties">
            <button id="tiePac" aria-pressed="true">Pacific-linked</button><button id="tieAll" aria-pressed="false">All</button>
          </div>
        </div>
        <div class="row"><span>View</span>
          <div class="seg" role="group" aria-label="Map tilt">
            <button id="tilt3d" aria-pressed="true">Tilted</button><button id="tilt2d" aria-pressed="false">Flat</button>
          </div>
        </div>
        <p class="note" id="mapNote"></p>
      </div>
    </div>

    <!-- Genealogy -->
    <div class="view" id="v-gen" hidden>
      <div id="genCanvas" style="position:absolute;inset:0"></div>
      <div class="overlay ctl" id="genCtl">
        <h3>Citation genealogy</h3>
        <div class="row"><span>Layout</span>
          <div class="seg" role="group" aria-label="Layout">
            <button id="layForce" aria-pressed="false">Network</button><button id="layTime" aria-pressed="true">Timeline</button>
          </div>
        </div>
        <div class="row"><label><input type="checkbox" id="showMain" checked> <span class="swatch" style="background:var(--star)"></span> Main path through the field</label></div>
        <div class="row"><label><input type="checkbox" id="showEdges" checked> <span class="swatch" style="background:var(--ink-3)"></span> Citation links</label></div>
        <h3 style="margin-top:12px">Schools of thought</h3>
        <div class="legend-list" id="commLegend"></div>
        <h3 style="margin-top:12px">Concept</h3>
        <div class="chips" id="conceptChips"></div>
        <p class="note">Dot size: citations from inside this field. Click a dot to trace what it cites and what cites it.</p>
      </div>
    </div>

    <!-- Key thinkers -->
    <div class="view page" id="v-people" hidden></div>
    <!-- What's missing -->
    <div class="view page" id="v-gaps" hidden></div>
    <!-- About -->
    <div class="view page" id="v-about" hidden></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<footer class="tide" id="tide">
  <button class="play" id="play" aria-label="Play the field's history">▶</button>
  <div class="yearread"><b id="yearB">2026</b><span id="yearS">all 4,123 works</span></div>
  <svg id="tideChart" role="slider" tabindex="0" aria-label="Show the field up to year" aria-valuemin="1960" aria-valuemax="2026"></svg>
</footer>

<div class="overlay tour" id="tour" hidden></div>

<script src="https://unpkg.com/deck.gl@9.3.11/dist.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(async function () {
"use strict";
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString("en-NZ");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fold = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[ʻ‘’'`ʹ]/g, "").toLowerCase();
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();

const tide = $("tideChart");
function renderTide() {
  const w = tide.clientWidth || 800, h = 64, padL = 4, padR = 4, base = h - 16;
  const n = Y1 - Y0 + 1, bw = (w - padL - padR) / n, max = Math.max(...yearCounts.values());
  let s = "";
  for (let y = Y0; y <= Y1; y++) {
    const v = yearCounts.get(y) || 0; const bh = v ? Math.max(1.5, Math.sqrt(v / max) * (base - 6)) : 0;
    const x = padL + (y - Y0) * bw;
    if (bh) s += `<rect x="${x + 0.5}" y="${base - bh}" width="${Math.max(1, bw - 2)}" height="${bh}" rx="1.5" fill="${y <= S.year ? "var(--s1)" : "var(--rule)"}"><title>${y}: ${v} works</title></rect>`;
    if (y % 10 === 0) s += `<text x="${x}" y="${h - 3}" fill="var(--ink-3)" font-size="12" font-family="IBM Plex Mono, monospace">${y}</text>`;
  }
  const hx = padL + (S.year - Y0 + 1) * bw;
  s += `<line x1="${padL}" x2="${w - padR}" y1="${base}" y2="${base}" stroke="var(--rule)"/>`;
  s += `<line x1="${hx}" x2="${hx}" y1="2" y2="${base}" stroke="var(--star)" stroke-width="2"/><circle cx="${hx}" cy="5" r="4" fill="var(--star)"/>`;
  D.events.forEach(e => { const x = padL + (e.year - Y0 + 0.5) * bw; s += `<rect x="${x - 2.5}" y="${base + 1}" width="5" height="5" transform="rotate(45 ${x} ${base + 3.5})" fill="var(--star)" opacity="${e.year <= S.year ? 1 : 0.35}"><title>${esc(e.date + " " + e.title)}</title></rect>`; });
  tide.setAttribute("viewBox", `0 0 ${w} ${h}`); tide.innerHTML = s; tide.setAttribute("aria-valuenow", S.year);
  $("yearB").textContent = S.year;

          <li><div><b>Now</b><span>Shape the seed list and corpus rules with the team; load the literature review’s curated records; refine names and affiliations.</span></div></li>
          <li><div><b>Next</b><span>Read full texts of theses and books to find methodological innovations embedded in larger works, with human review.</span></div></li>
          <li><div><b>Year two</b><span>Map talanoa and wānanga participation, events and co-locations from the situational analysis, with consent, into the same atlas.</span></div></li>
          <li><div><b>Ongoing</b><span>Host it, keep it current with new publications, and train researchers to run and extend it.</span></div></li>
        </ol>
      </div>
    </div>`;
}

// ---------------- search ----------------
const idxA = A.map(a => fold(a.name)), idxW = W.map(w => fold(w.t)), idxI = I.map(i => fold(i.name));
$("q").addEventListener("input", e => {
  const q = fold(e.target.value.trim()); const R = $("results");
  if (q.length < 2) { R.hidden = true; return; }
  const ma = []; for (let k = 0; k < A.length && ma.length < 40; k++) if (idxA[k].includes(q)) ma.push(k);
  ma.sort((x, y) => A[y].lc - A[x].lc);
  const mw = []; for (let k = 0; k < W.length && mw.length < 60; k++) if (idxW[k].includes(q)) mw.push(k);
  mw.sort(byLc);
  const mi = []; for (let k = 0; k < I.length && mi.length < 20; k++) if (idxI[k].includes(q)) mi.push(k);
  mi.sort((x, y) => I[y].w - I[x].w);
  let h = "";
  if (ma.length) h += `<h4>Scholars</h4>` + ma.slice(0, 6).map(a => `<button data-ra="${a}">${esc(A[a].name)} <small>· ${esc(instLabel(A[a].inst))}</small></button>`).join("");
  if (mi.length) h += `<h4>Institutions</h4>` + mi.slice(0, 4).map(n => `<button data-ri="${n}">${esc(I[n].name)} <small>· ${fmt(I[n].w)} works</small></button>`).join("");
  if (mw.length) h += `<h4>Works</h4>` + mw.slice(0, 6).map(i => `<button data-rw="${i}">${esc(W[i].t.slice(0, 90))} <small>· ${esc(workShort(i))}</small></button>`).join("");
  R.innerHTML = h || `<h4>No matches</h4>`; R.hidden = false;
  R.querySelectorAll("[data-ra]").forEach(b => b.onclick = () => { R.hidden = true; if (S.view !== "map" && S.view !== "gen") setView("map"); select({ type: "author", i: +b.dataset.ra }, { fly: true }); });
  R.querySelectorAll("[data-ri]").forEach(b => b.onclick = () => { R.hidden = true; if (S.view !== "map") setView("map"); select({ type: "inst", i: +b.dataset.ri }, { fly: true }); });
  R.querySelectorAll("[data-rw]").forEach(b => b.onclick = () => { R.hidden = true; if (S.view !== "gen") setView("gen"); select({ type: "work", i: +b.dataset.rw }); });
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("results").hidden = true; });

// ---------------- guided tour ----------------
const findAuthor = name => A.findIndex(a => fold(a.name) === fold(name));
const findSeedWork = key => D.seeds.find(s => s.key === key)?.work;
const TOUR = [
  { k: "1 · The sea of islands", t: "Where the field is written", p: "Each green dot is an institution, sized by its works in the field. Blue arcs are co-authorship ties: the vā between places. Press play to watch it grow from a handful of early texts to a network spanning the ocean.",
    go: () => { setView("map"); select(null); S.ly.flow = false; $("lyFlow").checked = false; mapVS = { longitude: 182, latitude: -12, zoom: 2.35, pitch: 38, bearing: 0, transitionDuration: 1200, transitionInterpolator: new deck.FlyToInterpolator() }; mapDeck.setProps({ initialViewState: mapVS }); setYear(Y1); } },
  { k: "2 · Co-location", t: "Where scholars shared a place", p: "Magenta rings mark institutions where several of the field’s most influential scholars published in the same five years: the co-locations a situational analysis looks for. Here, the University of Auckland, 2015–2019.",
    go: () => { setView("map"); setYear(2019); const c = D.colocations.find(c => /University of Auckland/.test(I[c.inst].name) && c.y0 === 2015); if (c) { select({ type: "coloc", key: c.inst + ":" + c.y0 }); const p = ipos(c.inst); mapVS = { ...mapVS, longitude: p[0], latitude: p[1], zoom: 4.2, transitionDuration: 1200, transitionInterpolator: new deck.FlyToInterpolator() }; mapDeck.setProps({ initialViewState: mapVS }); } } },
  { k: "3 · The genealogy", t: "How the field unfolded", p: "Every dot is a work, placed in its year and grouped into schools of thought. The starlight line is the main path, the backbone most citation paths run through, from Decolonizing Methodologies onward. Diamonds along the top are events.",
    go: () => { setView("gen"); setLayout("time"); setYear(Y1); select(null); } },
  { k: "4 · One text’s reach", t: "Talanoa, traced", p: "Vaioleti’s 2006 paper is the most cited text inside the field. Selecting it lights up everything it draws on and everything that cites it.",
    go: () => { setView("gen"); const i = findSeedWork("vaioleti2006"); if (i != null) select({ type: "work", i }); } },
  { k: "5 · People", t: "Who to talanoa with", p: "Key thinkers rank by citations from inside the field; networked scholars by how they bridge groups. Add people to the individual or group talanoa shortlist and copy it for the team.",
    go: () => { setView("people"); } },
  { k: "6 · The gap", t: "What the databases miss", p: "Guidelines, reports and journal articles at the heart of the field have no record, and nearly a quarter of the works found carry no reference list. The project’s curated datasets would fill this.",
    go: () => { setView("gaps"); } },
];
let tourAt = -1;
function showTour(k) {
  tourAt = k; const T = $("tour");
  if (k < 0 || k >= TOUR.length) { T.hidden = true; tourAt = -1; return; }
  const s = TOUR[k]; s.go();
  T.innerHTML = `<div class="k">${esc(s.k)}</div><h3>${esc(s.t)}</h3><p>${esc(s.p)}</p>
    <div class="btnrow"><button class="btn" id="tPrev" ${k === 0 ? "disabled" : ""}>Back</button><button class="btn on" id="tNext">${k === TOUR.length - 1 ? "Finish" : "Next"}</button><button class="btn" id="tEnd">Close</button></div>`;
  T.hidden = false;
  $("tPrev").onclick = () => showTour(k - 1); $("tNext").onclick = () => showTour(k + 1); $("tEnd").onclick = () => showTour(-1);
}
$("tourBtn").onclick = () => showTour(0);

// ---------------- boot ----------------
try { await document.fonts.load('600 14px "Source Sans 3"'); await document.fonts.load('400 14px "Source Sans 3"'); await document.fonts.load('500 14px "Alegreya"'); } catch { /* fallback fonts */ }
$("loading").remove();
const start = (location.hash || "").replace("#", "");
renderPanel(); renderTide();
setView(["map", "gen", "people", "gaps", "about"].includes(start) ? start : "map", false);
window.addEventListener("resize", () => { renderTide(); queueRelabel(); });
})();
</script>
