<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: night-sea chart, as in the Vā Atlas. Header + filter bar; each tab is a scrolling page
   (the map is full-bleed); a detail drawer slides in from the right for any selection. */
:root {
  color-scheme: dark;
  --sea: #0b1620;      /* ground: night ocean */
  --sea-1: #10202b;    /* panels */
  --sea-2: #173341;    /* raised, hover */
  --rule: #24414e;     /* hairlines */
  --ink: #f0f4f1;
  --ink-2: #c6d4d6;    /* 12:1 on --sea */
  --ink-3: #98aeb3;    /* 7.9:1 on --sea */
  --land: #1b2e35;
  --coast: #34535d;
  --star: #f2d48f;     /* accent: selection, focus */
  --star-ink: #1c1606;
  /* categorical slots, validated on --sea (validate_palette.js, dark): fixed order */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --other: #5d7479;
  --f-display: "Alegreya", "Iowan Old Style", Georgia, serif;
  --f-ui: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --step--1: 0.875rem; --step-0: 1rem; --step-1: 1.1875rem; --step-2: 1.5rem; --step-3: 2.25rem;
  --drawer-w: 430px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sea); color: var(--ink); font: 400 var(--step-0)/1.5 var(--f-ui);
  display: flex; flex-direction: column; overflow: hidden; }
body > header, body > .filters { flex: none; }
a { color: var(--star); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--star); outline-offset: 2px; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }

header.bar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
.brand { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand b { font: 700 var(--step-2)/1 var(--f-display); }
.brand span { font-size: var(--step--1); color: var(--ink-3); }
nav.tabs { display: flex; gap: 2px; background: var(--sea-1); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; overflow-x: auto; max-width: 100%; min-width: 0; }
nav.tabs button { background: none; border: 0; padding: 5px 12px; border-radius: 6px; color: var(--ink-2); white-space: nowrap; font-weight: 600; }
nav.tabs button[aria-selected="true"] { background: var(--sea-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--star); }
.search { position: relative; margin-left: auto; flex: 0 1 300px; min-width: 0; }
.search input { width: 100%; background: var(--sea-1); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; }
.search input::placeholder { color: var(--ink-3); }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(460px, 92vw); max-height: 60vh; overflow: auto; background: var(--sea-1);
  border: 1px solid var(--rule); border-radius: 10px; padding: 6px; z-index: 40; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.results h4 { margin: 8px 8px 4px; font: 600 0.8125rem/1 var(--f-ui); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; }
.results button:hover, .results button:focus-visible { background: var(--sea-2); }
.results small { color: var(--ink-3); font-size: 0.8125rem; }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; border-bottom: 1px solid var(--rule); background: var(--sea-1); font-size: var(--step--1); }
.filters .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filters .lab { color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; font-size: .75rem; font-weight: 600; }
.chip { border: 1px solid var(--rule); background: none; border-radius: 999px; padding: 2px 10px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--star); color: var(--ink); background: color-mix(in oklab, var(--star) 14%, transparent); }
.chip .n { font-family: var(--f-data); color: var(--ink-3); font-size: .78rem; }
.readout { margin-left: auto; color: var(--ink-2); }

main { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; overflow: hidden; }
.view { position: absolute; inset: 0; overflow-y: auto; }
.view[hidden] { display: none !important; }
.page { padding-block: 26px 60px; padding-inline: max(16px, 4vw); }
.page h1 { font: 500 var(--step-3)/1.1 var(--f-display); margin: 0 0 8px; text-wrap: balance; max-width: 30ch; }
.page h2 { font: 500 var(--step-2)/1.2 var(--f-display); margin: 34px 0 8px; text-wrap: balance; }
.page h3 { font: 600 var(--step-1)/1.25 var(--f-ui); margin: 20px 0 6px; }
.page p { max-width: 72ch; }
.lead { font-size: var(--step-1); color: var(--ink-2); max-width: 72ch; margin: 0 0 16px; }
.note { font-size: var(--step--1); color: var(--ink-3); max-width: 80ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }
.tile { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sea-1); min-width: 0; }
.tile b { display: block; font: 600 2rem/1.05 var(--f-ui); }
.tile span { color: var(--ink-2); font-size: var(--step--1); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 28px; }
.cols > div { min-width: 0; }
.card { border: 1px solid var(--rule); border-radius: 10px; background: var(--sea-1); padding: 14px 16px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--step--1); color: var(--ink-2); margin: 6px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--f-data); font-size: 11.5px; fill: var(--ink-3); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.toolbar input, .toolbar select { background: var(--sea-1); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: .75rem; white-space: nowrap; background: var(--sea-1); }
th button { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; }
th button[aria-sort] { color: var(--ink); }
td.num, th.num { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
td small { color: var(--ink-3); font-size: .8125rem; }
tbody tr:hover { background: var(--sea-1); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; text-align: left; }
.linkbtn:hover { color: var(--star); }
.hbar { display: block; height: 8px; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.pill { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: .78rem; border: 1px solid var(--rule); white-space: nowrap; }
.pill.y { border-color: color-mix(in oklab, var(--s3) 70%, transparent); color: #7fd6b3; }
.pill.n { border-color: color-mix(in oklab, var(--s2) 70%, transparent); color: #f0a07e; }
.pill.q { color: var(--ink-2); }
.pill.eng { border-color: color-mix(in oklab, var(--star) 70%, transparent); color: var(--star); font-size: .7rem; padding: 0 6px; }
.btn { background: var(--sea-2); border: 1px solid var(--rule); border-radius: 7px; padding: 5px 10px; color: var(--ink); text-decoration: none; font-size: var(--step--1); }
.more { margin-top: 10px; }

/* map */
#mapView { overflow: hidden; }
.overlay { position: absolute; z-index: 3; background: color-mix(in oklab, var(--sea-1) 92%, transparent); border: 1px solid var(--rule);
  border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); }
.ctl { top: 14px; left: 14px; width: 300px; max-height: calc(100% - 28px); overflow: auto; font-size: var(--step--1); }
.ctl h3 { margin: 0 0 8px; font: 600 .8125rem/1.2 var(--f-ui); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.ctl label { display: flex; align-items: center; gap: 8px; margin: 5px 0; color: var(--ink-2); cursor: pointer; }
.ctl input[type=checkbox] { accent-color: var(--star); }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; display: inline-block; }
.swatch { width: 18px; height: 4px; border-radius: 2px; flex: none; display: inline-block; }
.placelist { margin-top: 10px; display: grid; gap: 1px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; margin: 0 0 8px; }
.seg button { background: none; border: 0; padding: 4px 12px; color: var(--ink-2); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--sea-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--star); }
table.mini { font-size: .8125rem; } table.mini th, table.mini td { padding: 3px 6px; }
.placelist button { display: grid; grid-template-columns: 1fr auto; gap: 8px; background: none; border: 0; border-radius: 6px; padding: 3px 4px; color: var(--ink-2); text-align: left; }
.placelist button:hover { background: var(--sea-2); color: var(--ink); }

/* network */
.netwrap { position: relative; height: 560px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--sea); }

/* drawer */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(var(--drawer-w), 100%); background: var(--sea-1); border-left: 1px solid var(--rule);
  overflow-y: auto; padding: 18px 18px 40px; z-index: 50; box-shadow: -18px 0 40px rgba(0,0,0,.35); }
.drawer[hidden] { display: none; }
.drawer .close { position: absolute; top: 10px; right: 10px; background: none; border: 1px solid var(--rule); border-radius: 6px; color: var(--ink-3); width: 30px; height: 30px; }
.drawer .kind { font-size: .8125rem; color: var(--star); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.drawer h2 { font: 500 var(--step-2)/1.15 var(--f-display); margin: 4px 34px 6px 0; text-wrap: balance; }
.drawer .meta { color: var(--ink-2); margin: 0 0 10px; }
.drawer h3 { margin: 18px 0 6px; font: 600 .8125rem/1.2 var(--f-ui); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 12px 0; }
.facts div { border-top: 1px solid var(--rule); padding-top: 6px; }
.facts b { display: block; font: 600 var(--step-1)/1.1 var(--f-data); }
.facts span { font-size: .8125rem; color: var(--ink-3); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.list button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 6px; color: var(--ink); }
.list button:hover { background: var(--sea-2); }
.list small { display: block; color: var(--ink-3); font-size: .8125rem; }
.abstract { color: var(--ink-2); font-size: .9375rem; line-height: 1.6; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.wsthemes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.wsmaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.wsmap { border: 1px solid var(--rule); border-radius: 10px; background: var(--sea-1); overflow: hidden; min-width: 0; }
.wsmap img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; background: var(--sea-2); }
.wsmap .body { padding: 10px 14px 14px; font-size: var(--step--1); }
.postit { display: inline-block; background: color-mix(in oklab, var(--star) 14%, transparent); border: 1px solid color-mix(in oklab, var(--star) 45%, transparent); color: var(--ink); border-radius: 4px; padding: 2px 8px; margin: 4px 4px 0 0; font-size: .875rem; }

#tip { position: fixed; pointer-events: none; z-index: 60; background: rgba(16,32,43,.97); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 8px; padding: 7px 10px; font-size: 14px; line-height: 1.4; max-width: 340px; }
#tip[hidden] { display: none; }
.loading { padding: 40px; color: var(--ink-3); font: italic var(--step-1) var(--f-display); }

@media (max-width: 760px) {
  body { overflow: auto; }
  main { flex: none; height: 82vh; }
  .search { order: 3; flex-basis: 100%; margin-left: 0; }
  .ctl { width: auto; right: 14px; max-height: 45%; }
  .readout { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
(async function () {
"use strict";
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString("en-NZ");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fold = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[ʻ‘’'`]/g, "").toLowerCase();
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const rgb = (hex, a = 255) => { const h = hex.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), a]; };
const withA = (c, a) => [c[0], c[1], c[2], a];
const C = { sea: rgb(tok("--sea")), land: rgb(tok("--land")), coast: rgb(tok("--coast")), rule: rgb(tok("--rule")), ink: rgb(tok("--ink")),
  ink2: rgb(tok("--ink-2")), ink3: rgb(tok("--ink-3")), star: rgb(tok("--star")), other: rgb(tok("--other")),
  s: [1, 2, 3, 4, 5, 6, 7, 8].map(k => rgb(tok("--s" + k))) };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

// ------------------------------------------------------------------ data
let D, landTopo;
try {
  [D, landTopo] = await Promise.all([
    fetch("data/bph.json").then(r => { if (!r.ok) throw new Error("data " + r.status); return r.json(); }),
    fetch("data/land-50m.json").then(r => { if (!r.ok) throw new Error("land " + r.status); return r.json(); }),
  ]);
} catch (e) {
  $("loading").textContent = /404/.test(e.message)
    ? "The data files are not included here: they hold licensed Scopus/SciVal data and an internal University list. Rebuild them with bph/pipeline/run_all.sh from the University network (see bph/README.md)."
    : "Could not load the data files (" + e.message + "). Reload to try again.";
  return;
}
const W = D.works, A = D.authors, I = D.insts, T = D.topics, SV = D.scival, AW = D.awards;
const BUILT = D.meta.built, Y_PARTIAL = 2026;
const FAC = D.faculties;
const facColor = f => { const k = FAC.indexOf(f); return k >= 0 && k < 8 ? C.s[k] : C.other; };
const facCss = f => { const k = FAC.indexOf(f); return k >= 0 && k < 8 ? `var(--s${k + 1})` : "var(--other)"; };
const PLACE = Object.fromEntries(D.places.map(p => [p.code, p]));
const placeLabel = c => (PLACE[c] && PLACE[c].label) || c;
// SciVal placement of each work (w.sv = [Scopus ID, SciVal Topic index, status, SciVal FWCI, top-10% flag, match]).
const SVL = D.svlive, ST_T = SVL.topics, ST_C = SVL.clusters;
const ST = { c: "In the SRA dataset", s: "Screened out", n: "Never screened", x: "Not in SciVal" };
const ST_LONG = { c: "Its SciVal Topic or Topic Cluster is in the SRA dataset", s: "Its Topic or Cluster was screened for this SRA and marked “n”",
  n: "Neither its Topic nor its Cluster was on the screened list", x: "No Scopus record (or no SciVal Topic yet), so SciVal cannot see it" };
const ST_LOW = { c: "in the SRA dataset", s: "screened out", n: "never screened", x: "not in SciVal" };
const ST_COLOR = { c: "var(--s3)", s: "var(--s2)", n: "var(--s5)", x: "var(--other)" };
function stWhy(t) {
  const x = ST_T[t], cl = x.cl >= 0 ? ST_C[x.cl] : null;
  if (x.sra >= 0 && SV[x.sra].final === "y") return "The Topic itself is on the SRA3 list as included";
  if (cl && cl.sra >= 0 && SV[cl.sra].final === "y") return "Its Topic Cluster is on the SRA3 list as included";
  if (x.sra >= 0) return "The Topic is on the SRA3 list, marked n";
  if (cl && cl.sra >= 0) return "Its Topic Cluster is on the SRA3 list, marked n";
  return "Neither the Topic nor its Cluster is on the SRA3 list";
}
const stPill = (st, why) => `<span class="pill" style="border-color:${ST_COLOR[st]}"${why ? ` data-tip="${esc(why)}"` : ""}>${ST[st]}</span>`;
// Elsevier attribution (Scopus and SciVal Attribution Guides, dev.elsevier.com): name Scopus / SciVal as the
// source on every view showing their data, link back to them, and give api.elsevier.com and the retrieval dates.
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const longDate = iso => { if (!iso) return "–"; const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const RETRIEVED = (() => { const r = D.svmeta.retrieved; if (!r) return "–"; if (r[0] === r[1]) return longDate(r[0]);
  const [a, b] = [longDate(r[0]).split(" "), longDate(r[1]).split(" ")];
  return a[1] === b[1] && a[2] === b[2] ? `${a[0]}–${b[0]} ${a[1]} ${a[2]}` : `${longDate(r[0])} to ${longDate(r[1])}`; })();
const EXT = 'target="_blank" rel="noopener"';
const SCOPUS = `<a href="https://www.scopus.com" ${EXT}>Scopus</a>`, SCIVAL = `<a href="https://www.scival.com" ${EXT}>SciVal</a>`, ELSAPI = `<a href="https://api.elsevier.com" ${EXT}>api.elsevier.com</a>`;
const elsSrc = (what = "both") => `<p class="note src">Source: ${what === "scival" ? SCIVAL : what === "scopus" ? SCOPUS : `${SCOPUS} and ${SCIVAL}`} (Elsevier B.V.), via ${ELSAPI}, retrieved ${RETRIEVED}${what !== "scopus" ? `; SciVal data release ${longDate(D.svmeta.release)}` : ""}. Used under the University of Auckland's subscription.</p>`;
const scopusUrl = id => `https://www.scopus.com/inward/record.uri?partnerID=HzOxMe3b&amp;scp=${encodeURIComponent(id)}&amp;origin=inward`;
const pill = v => v === "y" ? '<span class="pill y">y</span>' : v === "n" ? '<span class="pill n">n</span>' : v === "?" ? '<span class="pill q">?</span>' : '<span class="muted">–</span>';
const TIER = { f: "Pacific-focused", p: "Pacific peoples within a wider study", m: "Single passing mention" };

// ------------------------------------------------------------------ filters
// Lenses: P Pacific Islands & peoples, O Pacific Ocean & region, A Aotearoa environment & hazards,
// M Ocean, Earth & climate (five sub-themes). The strength tiers apply to the two Pacific lenses only.
const LENS_KEYS = ["P", "O", "A", "M"], MS_KEYS = ["eco", "ocn", "geo", "ant", "gov"];
const MS_BIT = { eco: 1, ocn: 2, geo: 4, ant: 8, gov: 16 };

function stackedBars(rows, keys, colors, opts) {

        if (layer.id === "ws-dots") return { html: `<b>${esc(object.label)}</b><br>${fmt(object.n)} dot${object.n > 1 ? "s" : ""}: ${Object.entries(object.by).map(([k, v]) => `${esc(mapName[k])} ${v}`).join(", ")}`, style: tipStyle };
        if (layer.id === "ws-research") return { html: `<b>${esc(object.p.label)}</b><br>${fmt(object.n)} UoA works name it`, style: tipStyle };
        return null;
      },
      getCursor: ({ isHovering, isDragging }) => isDragging ? "grabbing" : isHovering ? "pointer" : "grab" });
  }
  wsDeck.setProps({ layers: wsLayers(rows) });
}

function renderAbout() {
  const el = $("v-about"); if (el.dataset.built) return; el.dataset.built = "1";
  const cv = D.coverage;
  const inScopus = W.filter(w => w.sv[0]).length, byTitle = W.filter(w => w.sv[5] === "title").length, inSv = W.filter(w => w.sv[1] >= 0).length;

  el.innerHTML = `<h1>About this landscape</h1>
    <p class="lead">A first pass at mapping the University of Auckland's research in or about the Pacific, and its ocean, Earth and climate research, for Mā Kiwa te moana nui e whakaumu | Blue Pacific Horizons, built by the Centre for eResearch from OpenAlex (open data) and the University's Scopus and SciVal subscription.</p>
    <div class="cols"><div>
      <h2>What counts as Pacific research here</h2>
      <p>Works with at least one University of Auckland author, 2020 to ${esc(BUILT)}, from OpenAlex. A work is in when it falls in one of four lenses:</p>
      <ul><li><b>Pacific Islands &amp; peoples:</b> ${esc(LENS_HELP.P)}</li><li><b>Pacific Ocean &amp; region:</b> ${esc(LENS_HELP.O)}</li><li><b>Aotearoa environment &amp; hazards:</b> ${esc(LENS_HELP.A)} This follows the SRA's framing of Aotearoa as part of the Pacific region.</li>
        <li><b>Ocean, Earth &amp; climate</b> (added in November 2026 after BPH's review): ${esc(LENS_HELP.M)} Its five themes can be switched on and off in the filter bar.</li></ul>
      <p>Each work also has one plain-language <b>research area</b> (Strengths tab): the five ocean and Earth themes, and ten others from the OpenAlex field and subfield of its main topic.</p>
      <p>OpenAlex search finds ${fmt(cv.candidates)} candidates; each is then checked against its title, abstract and keywords. False friends are dropped ("Asia-Pacific", "Indo-Pacific", the WHO Western Pacific Region, "Pacific oyster", the Canada-France-Hawaii Telescope). ${fmt(cv.kept)} pass; ${fmt(cv.dropped)} do not (${fmt(cv.dropped_no_abstract)} of those had no abstract to check, because some publishers withhold them from OpenAlex).</p>
      <h3>Strength</h3>
      <ul><li><b>Pacific-focused</b> (${fmt(cv.tiers.f)}): ${esc(TIER_HELP.f)}</li><li><b>Within wider studies</b> (${fmt(cv.tiers.p)}): ${esc(TIER_HELP.p)}</li><li><b>Single mention</b> (${fmt(cv.tiers.m)}): ${esc(TIER_HELP.m)}</li></ul>
      <p>The default view shows Pacific-focused works plus the Aotearoa and ocean, Earth &amp; climate lenses. Works within wider studies and single mentions are off by default; switch them on above. With every lens on, clicking one shows only that lens; "All" brings them back.</p>
      <p>Spot checks: in a random sample of 40 Pacific-focused works, 38 were plainly research in or about the Pacific; the other two named Pacific climate modes or Pacific athletes in passing. In a random sample of 25 works from the Aotearoa lens alone, 24 were environment, ocean or hazards research; the other studied sustainability attitudes. In a random sample of 40 works added by the ocean, Earth &amp; climate lens alone, 37 were plainly marine, ocean, Earth-hazard or polar research; the other three were a coastal-tourism study, an atmospheric aerosol study and an urban-greening study after the Christchurch earthquakes. Earthquake engineering of buildings is left out of that lens unless it also concerns tsunami, subduction or the seafloor; disaster studies count only in Aotearoa or the Pacific.</p>
      <h2>Sources</h2>
      <ul><li><b>OpenAlex</b> (CC0): works, authorships and affiliations, topics, citations, FWCI and top-10% flags, funders, SDGs, institutions and their locations; and public award records (HRC research repository, Marsden Fund lists, MBIE "who got funded", and overseas funders).</li>
        <li><b>Scopus and SciVal</b> (Elsevier B.V.; ${SCOPUS}, ${SCIVAL}; data retrieved through ${ELSAPI} on ${RETRIEVED}, SciVal data release ${longDate(D.svmeta.release)}; used under the University of Auckland's subscription): each work's Scopus record, SciVal Topic and Topic Cluster, SciVal FWCI; UoA's SciVal output by Topic and Cluster for ${D.svmeta.start}–${D.svmeta.end}; the Topics of ${Object.keys(SVL.pic_countries).length} Pacific Island countries and territories; and the keyword probes. APIs used: Scopus Search; SciVal Publication, Topic, Topic Cluster and Country (every endpoint, parameter and request count is listed in bph/README.md). These data are for University use under the licence: share this page within the University only.</li>
        <li><b>Marsden Fund round lists, 2018–2025</b> (<a href="https://www.royalsociety.org.nz/what-we-do/funds-and-opportunities/marsden/awarded-grants/" target="_blank" rel="noopener">Royal Society Te Apārangi</a>): every funded project with its team and abstract; kept when a UoA researcher is on the team (${fmt(cv.marsden_rounds || 0)} projects).</li>
        <li><b>SRA3 SciVal Topics &amp; Topic Clusters</b>, with the SciVal dataset methodology, prepared by Research Services for the Research and Innovation Office.</li>
        <li><b>The SRA's stakeholder engagement list</b> and <b>Workshop 2</b> (photos of the map activity and the workshop summary), from the Blue Pacific Horizons convening team: the Researchers tab's engagement check and the Workshop maps tab.</li>
        <li><b>Not included:</b> non-public data from the University's grant and ethics application systems. It is managed by the Research and Innovation Office for consent and privacy reasons and would need their permission.</li></ul>
    </div><div>
      <h2>Read it with care</h2>
      <p>The atlas is built from OpenAlex, which indexes more than Scopus: ${fmt(inScopus)} of its ${fmt(W.length)} works have a Scopus record (${fmt(inScopus - byTitle)} found by DOI, ${fmt(byTitle)} by exact title and year), and ${fmt(inSv)} have a SciVal Topic. The rest are mostly conference abstracts, preprints, datasets, book chapters and papers in regional journals Scopus does not index; they are counted as "Not in SciVal" on the alignment tab. OpenAlex and SciVal FWCI differ because their databases differ. About 1.5% of the atlas's records duplicate another (a preprint and its article, a chapter listed twice); counts are of OpenAlex records.</p>
      <p>SciVal figures cover its current five complete years (${D.svmeta.start}–${D.svmeta.end}); the 2025 SRA screening used 2020–2024. SciVal Topics are stable, but ${fmt(SV.length - svFound)} of the ${fmt(SV.length)} names on the SRA3 list were not found in SciVal today${SVL.unmatched.length ? ` (${esc(SVL.unmatched.slice(0, 3).join("; "))}${SVL.unmatched.length > 3 ? "; …" : ""})` : ""}.</p>
      <p>Faculty and unit come from affiliation text (${pct(cv.authors_with_faculty, cv.authors)}% of researchers matched) and author identities from OpenAlex's automated disambiguation; both will contain errors. ${fmt(cv.no_abstract)} works have no abstract in OpenAlex and were judged on title and keywords.</p>
      <p>Award coverage is uneven: Marsden Fund records come from OpenAlex to 2017 (UoA-led only) and from the Royal Society's round lists for 2018–2025 (UoA lead or team member), so UoA team members on Marsden projects led elsewhere before 2018 are missing; MBIE records are UoA-led only, so programmes led by GNS, NIWA or others with UoA partners (for example on the Hikurangi margin) are missing; HRC records carry no end dates, and ${fmt(2074)} HRC awards record no lead institution. Awards are classified from their title and description or abstract.</p>
      <p>People on the engagement list are matched to UoA authors by name; OpenAlex sometimes splits one person into several profiles or merges two people, so check the matches before relying on them.</p>
      <p>Bibliometrics see published, indexed work. They miss community reports, much Pacific-language scholarship, and the relationships behind the research. Use these numbers to prompt conversations, not to rank people.</p>
      <h2>Next steps for the pilot</h2>
      <ol><li>Review the probes for the missing areas, the ocean, Earth &amp; climate lens and the engagement check together: are any areas still missing (for example disaster studies beyond the Pacific, or earthquake engineering), and are the people right?</li>
        <li>With the Research and Innovation Office, decide which never-screened and screened-out Pacific Topics should join the SRA dataset in SciVal, and refresh it for ${D.svmeta.start}–${D.svmeta.end}.</li>
        <li>Refine faculty and unit mapping and author identities for key researchers.</li>
        <li>If approved by the Research and Innovation Office, add grants, active projects and ethics data; then a gap analysis against the SRA's goals.</li></ol>
      <p class="note">Built ${esc(BUILT)} from the pipeline in <span class="mono">bph/pipeline</span> (run_all.sh). Rank among universities: ${esc(D.world.p_universities.slice(0, 5).map((u, k) => `${k + 1}. ${u[0]}`).join("; "))}.</p>
    </div></div>`;
}

      [a.amt ? (a.cur === "NZD" ? "NZ$" : (a.cur || "") + " ") + fmt(Math.round(a.amt)) : "–", rs ? "funding, excl. GST (whole grant)" : "amount"], [esc(a.lead || "–"), rs ? "contact investigator" : "lead investigator"]])}
    ${rs ? `<p class="meta">${a.role === "lead" ? "UoA-led" : `Led by ${esc(a.org || "another institution")}, with UoA researchers on the team`}${a.uoa && a.uoa.length ? `. UoA team: ${esc(a.uoa.join(", "))}` : ""}.</p>` : ""}
    <p class="meta">${a.pac || a.pacp ? esc(a.ev.join("; ")) : rs ? "Its title and abstract fall outside the lenses." : "Linked through works in this atlas that acknowledge it."}</p>
    ${a.d ? `<h3>${rs ? "Abstract" : "Description"}</h3><p class="abstract">${esc(a.d)}</p>` : ""}
    ${ws.length ? `<h3>Works in this atlas that acknowledge it</h3><ul class="list">${ws.map(workItem).join("")}</ul>` : ""}
    <div class="btnrow">${a.url ? `<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">${rs ? "Royal Society round list" : "Funder page"}</a>` : ""}${rs ? "" : `<a class="btn" href="https://openalex.org/${esc(a.id)}" target="_blank" rel="noopener">OpenAlex record</a>`}</div>`);
}
function areaWorks(k) { return FW.filter(i => W[i].ra === k).sort(byCites); }
function openArea(k) {
  const ws = areaWorks(k), people = {}; ws.forEach(i => W[i].a.forEach(a => people[a] = (people[a] || 0) + 1));
  const tp = {}; ws.forEach(i => { if (W[i].tp >= 0) tp[W[i].tp] = (tp[W[i].tp] || 0) + 1; });
  const fac = {}; ws.forEach(i => new Set(W[i].a.map(a => A[a].faculty || "Not recorded")).forEach(f => fac[f] = (fac[f] || 0) + 1));
  openDrawer(`<div class="kind">Research area</div><h2>${esc(D.research_areas[k] || k)}</h2>
    ${facts([[fmt(ws.length), "works under the filters"], [fmt(Object.keys(people).length), "UoA researchers"]])}
    ${MS_KEYS.includes(k) ? `<p class="meta">${esc(MS_HELP[k])}</p>` : ""}
    <h3>Faculties</h3><p class="meta">${Object.entries(fac).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([f, n]) => `${esc(f)} <span class="mono muted">${n}</span>`).join("<br>")}</p>
    <h3>Topics</h3><p class="meta">${Object.entries(tp).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([t, n]) => `<button class="linkbtn" data-topic="${t}">${esc(T[t].name)}</button> <span class="mono muted">${n}</span>`).join("<br>")}</p>
    <h3>Researchers</h3><ul class="list">${Object.entries(people).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([a, n]) => authorItem(+a, `${n} work${n > 1 ? "s" : ""}`)).join("")}</ul>
    <h3>Most cited works</h3><ul class="list">${ws.slice(0, 15).map(workItem).join("")}</ul>`);
}
function openCountry(key) {
  const c = (mapCache || mapData()).countries.find(x => x.key === key);
  if (!c) return;
  const ws = c.idx.slice().sort(byCites), people = {}; ws.forEach(i => W[i].a.forEach(a => people[a] = (people[a] || 0) + 1));
  openDrawer(`<div class="kind">Partner country · ${esc(c.region)}</div><h2>${esc(c.name)}</h2>
    ${facts([[fmt(c.n), "works co-authored with UoA (filters)"], [fmt(c.ni), "partner institutions"], [fmt(Object.keys(people).length), "UoA researchers involved"]])}
    <h3>Partner institutions</h3><ul class="list">${c.insts.slice(0, 15).map(p => `<li><button data-inst="${p.i}">${esc(p.it.name)}<small>${esc(p.it.city || "")} · ${fmt(p.n)} joint work${p.n > 1 ? "s" : ""}</small></button></li>`).join("")}</ul>
    <h3>UoA researchers</h3><ul class="list">${Object.entries(people).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([a, n]) => authorItem(+a, `${n} joint work${n > 1 ? "s" : ""}`)).join("")}</ul>
    <h3>Most cited joint works</h3><ul class="list">${ws.slice(0, 12).map(workItem).join("")}</ul>`);
}
function openProbe(k) {
  const p = D.probes.probes[k];
  const yl = esc(D.probes.years);
  openDrawer(`<div class="kind">Keyword probe (example)</div><h2>${esc(p.label)}</h2><p class="meta">${esc(p.terms.join(" · "))}</p>
    ${facts([[fmt(p.uoa_all), `UoA publications ${yl}, all research (Scopus)`], [fmt(p.uoa_pac), "UoA, naming the Pacific"], [fmt(p.world_pac), "world, naming the Pacific"], [p.share == null ? "–" : p.share.toFixed(1) + "%", "UoA share"],
      [p.n_u ? pct(p.in_u, p.n_u) + "%" : "–", `of UoA's ${fmt(p.n_u)} Pacific papers are in the SRA dataset`], [p.n_w ? pct(p.in_w, p.n_w) + "%" : "–", `of the ${fmt(p.n_w)} most relevant world papers are`]])}
    <h3>SciVal Topics these papers belong to</h3><ul class="list">${p.topics.map(t => `<li>${t.ix >= 0 ? `<button data-svt="${t.ix}">` : "<div style='padding:5px 6px'>"}${esc(t.name)}<small>${ST[t.st]} · ${t.w} of the world sample · ${t.u} of UoA's · UoA output ${fmt(t.uoa)} (2021–25)</small>${t.ix >= 0 ? "</button>" : "</div>"}</li>`).join("") || "<li class='muted'>No papers found.</li>"}</ul>
    <h3>Works in this atlas matching the terms</h3><ul class="list">${p.works.slice(0, 20).map(workItem).join("") || "<li class='muted'>None.</li>"}</ul>
    ${elsSrc()}`);
}
function wireCommon(root) {
  root.querySelectorAll("[data-work]").forEach(b => b.onclick = () => openWork(+b.dataset.work));
  root.querySelectorAll("[data-author]").forEach(b => b.onclick = () => openAuthor(+b.dataset.author));
  root.querySelectorAll("[data-inst]").forEach(b => b.onclick = () => openInst(+b.dataset.inst));
  root.querySelectorAll("[data-place]").forEach(b => b.onclick = () => openPlace(b.dataset.place));
  root.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => openTopic(+b.dataset.topic));
  root.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => openSubfield(b.dataset.sub));
  root.querySelectorAll("[data-sv]").forEach(b => b.onclick = () => openSV(+b.dataset.sv));
  root.querySelectorAll("[data-svt]").forEach(b => b.onclick = () => openSVT(+b.dataset.svt));
  root.querySelectorAll("[data-ra]").forEach(b => b.onclick = () => openArea(b.dataset.ra));
  root.querySelectorAll("[data-country]").forEach(b => b.onclick = () => openCountry(b.dataset.country));
  root.querySelectorAll("[data-award]").forEach(b => b.onclick = () => openAward(+b.dataset.award));
  root.querySelectorAll("[data-probe]").forEach(b => b.onclick = () => openProbe(+b.dataset.probe));
}
document.addEventListener("keydown", e => { if (e.key === "Escape") drawer.hidden = true; });

// ================================================================== SEARCH
const idxA = A.map(a => fold(a.name)), idxW = W.map(w => fold(w.t)), idxT = T.map(t => fold(t.name)), idxI = I.map(i => fold(i.name));
$("q").addEventListener("input", e => {
  const q = fold(e.target.value.trim()), R = $("results");
  if (q.length < 2) { R.hidden = true; return; }
  const pick = (idx, n) => { const out = []; for (let k = 0; k < idx.length && out.length < n; k++) if (idx[k].includes(q)) out.push(k); return out; };
  const ma = pick(idxA, 40).sort((x, y) => A[y].n - A[x].n).slice(0, 6), mt = pick(idxT, 20).slice(0, 4), mi = pick(idxI, 20).filter(i => i !== D.uoa_inst).sort((x, y) => I[y].n - I[x].n).slice(0, 4), mw = pick(idxW, 60).sort(byCites).slice(0, 6);
  let h = "";
  if (ma.length) h += `<h4>Researchers</h4>` + ma.map(a => `<button data-author="${a}">${esc(A[a].name)} <small>· ${esc(A[a].faculty || "")} · ${fmt(A[a].n)} works</small></button>`).join("");
  if (mt.length) h += `<h4>Topics</h4>` + mt.map(t => `<button data-topic="${t}">${esc(T[t].name)}</button>`).join("");
  if (mi.length) h += `<h4>Partner institutions</h4>` + mi.map(i => `<button data-inst="${i}">${esc(I[i].name)} <small>· ${esc(I[i].cc || "")}</small></button>`).join("");
  if (mw.length) h += `<h4>Works</h4>` + mw.map(i => `<button data-work="${i}">${esc(W[i].t.slice(0, 90))} <small>· ${W[i].y}</small></button>`).join("");
  R.innerHTML = h || "<h4>No matches</h4>"; R.hidden = false; wireCommon(R);
  R.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { R.hidden = true; }));
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("results").hidden = true; });

try { await document.fonts.load('600 14px "Source Sans 3"'); await document.fonts.load('400 14px "Source Sans 3"'); } catch { /* fallback */ }
$("loading").remove();
