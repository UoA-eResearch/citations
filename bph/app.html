<title>Blue Pacific Research Landscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: night-sea chart, as in the Vā Atlas. Header + filter bar; each tab is a scrolling page
   (the map is full-bleed); a detail drawer slides in from the right for any selection. */
:root {
  color-scheme: dark;
  --sea: #0b1620;      /* ground: night ocean */
  --sea-1: #10202b;    /* panels */
  --sea-2: #173341;    /* raised, hover */
  --rule: #24414e;     /* hairlines */
  --ink: #f0f4f1;
  --ink-2: #c6d4d6;    /* 12:1 on --sea */
  --ink-3: #98aeb3;    /* 7.9:1 on --sea */
  --land: #1b2e35;
  --coast: #34535d;
  --star: #f2d48f;     /* accent: selection, focus */
  --star-ink: #1c1606;
  /* categorical slots, validated on --sea (validate_palette.js, dark): fixed order */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --other: #5d7479;
  --f-display: "Alegreya", "Iowan Old Style", Georgia, serif;
  --f-ui: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --step--1: 0.875rem; --step-0: 1rem; --step-1: 1.1875rem; --step-2: 1.5rem; --step-3: 2.25rem;
  --drawer-w: 430px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sea); color: var(--ink); font: 400 var(--step-0)/1.5 var(--f-ui);
  display: flex; flex-direction: column; overflow: hidden; }
body > header, body > .filters { flex: none; }
a { color: var(--star); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--star); outline-offset: 2px; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }

header.bar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
.brand { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand b { font: 700 var(--step-2)/1 var(--f-display); }
.brand span { font-size: var(--step--1); color: var(--ink-3); }
nav.tabs { display: flex; gap: 2px; background: var(--sea-1); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; overflow-x: auto; max-width: 100%; min-width: 0; }
nav.tabs button { background: none; border: 0; padding: 5px 12px; border-radius: 6px; color: var(--ink-2); white-space: nowrap; font-weight: 600; }
nav.tabs button[aria-selected="true"] { background: var(--sea-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--star); }
.search { position: relative; margin-left: auto; flex: 0 1 300px; min-width: 0; }
.search input { width: 100%; background: var(--sea-1); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; }
.search input::placeholder { color: var(--ink-3); }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(460px, 92vw); max-height: 60vh; overflow: auto; background: var(--sea-1);
  border: 1px solid var(--rule); border-radius: 10px; padding: 6px; z-index: 40; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.results h4 { margin: 8px 8px 4px; font: 600 0.8125rem/1 var(--f-ui); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; }
.results button:hover, .results button:focus-visible { background: var(--sea-2); }
.results small { color: var(--ink-3); font-size: 0.8125rem; }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; border-bottom: 1px solid var(--rule); background: var(--sea-1); font-size: var(--step--1); }
.filters .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filters .lab { color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; font-size: .75rem; font-weight: 600; }
.chip { border: 1px solid var(--rule); background: none; border-radius: 999px; padding: 2px 10px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--star); color: var(--ink); background: color-mix(in oklab, var(--star) 14%, transparent); }
.chip .n { font-family: var(--f-data); color: var(--ink-3); font-size: .78rem; }
.readout { margin-left: auto; color: var(--ink-2); }

main { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; overflow: hidden; }
.view { position: absolute; inset: 0; overflow-y: auto; }
.view[hidden] { display: none !important; }
.page { padding-block: 26px 60px; padding-inline: max(16px, 4vw); }
.page h1 { font: 500 var(--step-3)/1.1 var(--f-display); margin: 0 0 8px; text-wrap: balance; max-width: 30ch; }
.page h2 { font: 500 var(--step-2)/1.2 var(--f-display); margin: 34px 0 8px; text-wrap: balance; }
.page h3 { font: 600 var(--step-1)/1.25 var(--f-ui); margin: 20px 0 6px; }
.page p { max-width: 72ch; }
.lead { font-size: var(--step-1); color: var(--ink-2); max-width: 72ch; margin: 0 0 16px; }
.note { font-size: var(--step--1); color: var(--ink-3); max-width: 80ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }
.tile { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sea-1); min-width: 0; }
.tile b { display: block; font: 600 2rem/1.05 var(--f-ui); }
.tile span { color: var(--ink-2); font-size: var(--step--1); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 28px; }
.cols > div { min-width: 0; }
.card { border: 1px solid var(--rule); border-radius: 10px; background: var(--sea-1); padding: 14px 16px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--step--1); color: var(--ink-2); margin: 6px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--f-data); font-size: 11.5px; fill: var(--ink-3); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.toolbar input, .toolbar select { background: var(--sea-1); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: .75rem; white-space: nowrap; background: var(--sea-1); }
th button { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; }
th button[aria-sort] { color: var(--ink); }
td.num, th.num { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
td small { color: var(--ink-3); font-size: .8125rem; }
tbody tr:hover { background: var(--sea-1); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; text-align: left; }
.linkbtn:hover { color: var(--star); }
.hbar { display: block; height: 8px; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.pill { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: .78rem; border: 1px solid var(--rule); white-space: nowrap; }
.pill.y { border-color: color-mix(in oklab, var(--s3) 70%, transparent); color: #7fd6b3; }
.pill.n { border-color: color-mix(in oklab, var(--s2) 70%, transparent); color: #f0a07e; }
.pill.q { color: var(--ink-2); }
.btn { background: var(--sea-2); border: 1px solid var(--rule); border-radius: 7px; padding: 5px 10px; color: var(--ink); text-decoration: none; font-size: var(--step--1); }
.more { margin-top: 10px; }

/* map */
#mapView { overflow: hidden; }
.overlay { position: absolute; z-index: 3; background: color-mix(in oklab, var(--sea-1) 92%, transparent); border: 1px solid var(--rule);
  border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); }
.ctl { top: 14px; left: 14px; width: 300px; max-height: calc(100% - 28px); overflow: auto; font-size: var(--step--1); }
.ctl h3 { margin: 0 0 8px; font: 600 .8125rem/1.2 var(--f-ui); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.ctl label { display: flex; align-items: center; gap: 8px; margin: 5px 0; color: var(--ink-2); cursor: pointer; }
.ctl input[type=checkbox] { accent-color: var(--star); }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; display: inline-block; }
.swatch { width: 18px; height: 4px; border-radius: 2px; flex: none; display: inline-block; }
.placelist { margin-top: 10px; display: grid; gap: 1px; }
.placelist button { display: grid; grid-template-columns: 1fr auto; gap: 8px; background: none; border: 0; border-radius: 6px; padding: 3px 4px; color: var(--ink-2); text-align: left; }
.placelist button:hover { background: var(--sea-2); color: var(--ink); }

/* network */
.netwrap { position: relative; height: 560px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--sea); }

/* drawer */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(var(--drawer-w), 100%); background: var(--sea-1); border-left: 1px solid var(--rule);
  overflow-y: auto; padding: 18px 18px 40px; z-index: 50; box-shadow: -18px 0 40px rgba(0,0,0,.35); }
.drawer[hidden] { display: none; }
.drawer .close { position: absolute; top: 10px; right: 10px; background: none; border: 1px solid var(--rule); border-radius: 6px; color: var(--ink-3); width: 30px; height: 30px; }
.drawer .kind { font-size: .8125rem; color: var(--star); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.drawer h2 { font: 500 var(--step-2)/1.15 var(--f-display); margin: 4px 34px 6px 0; text-wrap: balance; }
.drawer .meta { color: var(--ink-2); margin: 0 0 10px; }
.drawer h3 { margin: 18px 0 6px; font: 600 .8125rem/1.2 var(--f-ui); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 12px 0; }
.facts div { border-top: 1px solid var(--rule); padding-top: 6px; }
.facts b { display: block; font: 600 var(--step-1)/1.1 var(--f-data); }
.facts span { font-size: .8125rem; color: var(--ink-3); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.list button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 6px; color: var(--ink); }
.list button:hover { background: var(--sea-2); }
.list small { display: block; color: var(--ink-3); font-size: .8125rem; }
.abstract { color: var(--ink-2); font-size: .9375rem; line-height: 1.6; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

#tip { position: fixed; pointer-events: none; z-index: 60; background: rgba(16,32,43,.97); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 8px; padding: 7px 10px; font-size: 14px; line-height: 1.4; max-width: 340px; }
#tip[hidden] { display: none; }
.loading { padding: 40px; color: var(--ink-3); font: italic var(--step-1) var(--f-display); }

@media (max-width: 760px) {
  body { overflow: auto; }
  main { flex: none; height: 82vh; }
  .search { order: 3; flex-basis: 100%; margin-left: 0; }
  .ctl { width: auto; right: 14px; max-height: 45%; }
  .readout { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="bar">
  <div class="brand"><b>Blue Pacific Research Landscape</b><span>University of Auckland research in or about the Pacific · 2020–2026</span></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-view="overview" aria-selected="true">Strengths</button>

</header>
<div class="filters" id="filters" aria-label="Filters"></div>
<main id="main">
  <div class="loading" id="loading">Loading the landscape…</div>
  <section class="view page" id="v-overview" hidden></section>

    <div id="mapCanvas" style="position:absolute;inset:0"></div>

</main>

<script src="https://unpkg.com/deck.gl@9.3.11/dist.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(async function () {
"use strict";
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString("en-NZ");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fold = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[ʻ‘’'`]/g, "").toLowerCase();
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const rgb = (hex, a = 255) => { const h = hex.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), a]; };
const withA = (c, a) => [c[0], c[1], c[2], a];
const C = { sea: rgb(tok("--sea")), land: rgb(tok("--land")), coast: rgb(tok("--coast")), rule: rgb(tok("--rule")), ink: rgb(tok("--ink")),
  ink2: rgb(tok("--ink-2")), ink3: rgb(tok("--ink-3")), star: rgb(tok("--star")), other: rgb(tok("--other")),
  s: [1, 2, 3, 4, 5, 6, 7, 8].map(k => rgb(tok("--s" + k))) };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

// ------------------------------------------------------------------ data
let D, landTopo;
try {
  [D, landTopo] = await Promise.all([
    fetch("data/bph.json").then(r => { if (!r.ok) throw new Error("data " + r.status); return r.json(); }),
    fetch("data/land-50m.json").then(r => { if (!r.ok) throw new Error("land " + r.status); return r.json(); }),
  ]);
} catch (e) {
  $("loading").textContent = /404/.test(e.message)
    ? "The data files are not included here: they hold licensed Scopus/SciVal data and an internal University list. Rebuild them with bph/pipeline/run_all.sh from the University network (see bph/README.md)."
    : "Could not load the data files (" + e.message + "). Reload to try again.";
  return;
}
const W = D.works, A = D.authors, I = D.insts, T = D.topics, SV = D.scival, AW = D.awards;
const BUILT = D.meta.built, Y_PARTIAL = 2026;
const FAC = D.faculties;
const facColor = f => { const k = FAC.indexOf(f); return k >= 0 && k < 8 ? C.s[k] : C.other; };
const facCss = f => { const k = FAC.indexOf(f); return k >= 0 && k < 8 ? `var(--s${k + 1})` : "var(--other)"; };
const PLACE = Object.fromEntries(D.places.map(p => [p.code, p]));
const placeLabel = c => (PLACE[c] && PLACE[c].label) || c;
// SciVal placement of each work (w.sv = [Scopus ID, SciVal Topic index, status, SciVal FWCI, top-10% flag, match]).
const SVL = D.svlive, ST_T = SVL.topics, ST_C = SVL.clusters;
const ST = { c: "In the SRA dataset", s: "Screened out", n: "Never screened", x: "Not in SciVal" };
const ST_LONG = { c: "Its SciVal Topic or Topic Cluster is in the SRA dataset", s: "Its Topic or Cluster was screened for this SRA and marked “n”",
  n: "Neither its Topic nor its Cluster was on the screened list", x: "No Scopus record (or no SciVal Topic yet), so SciVal cannot see it" };
const ST_LOW = { c: "in the SRA dataset", s: "screened out", n: "never screened", x: "not in SciVal" };
const ST_COLOR = { c: "var(--s3)", s: "var(--s2)", n: "var(--s5)", x: "var(--other)" };
function stWhy(t) {
  const x = ST_T[t], cl = x.cl >= 0 ? ST_C[x.cl] : null;
  if (x.sra >= 0 && SV[x.sra].final === "y") return "The Topic itself is on the SRA3 list as included";
  if (cl && cl.sra >= 0 && SV[cl.sra].final === "y") return "Its Topic Cluster is on the SRA3 list as included";
  if (x.sra >= 0) return "The Topic is on the SRA3 list, marked n";
  if (cl && cl.sra >= 0) return "Its Topic Cluster is on the SRA3 list, marked n";
  return "Neither the Topic nor its Cluster is on the SRA3 list";
}
const stPill = (st, why) => `<span class="pill" style="border-color:${ST_COLOR[st]}"${why ? ` data-tip="${esc(why)}"` : ""}>${ST[st]}</span>`;
// Elsevier attribution (Scopus and SciVal Attribution Guides, dev.elsevier.com): name Scopus / SciVal as the
// source on every view showing their data, link back to them, and give api.elsevier.com and the retrieval dates.
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const longDate = iso => { if (!iso) return "–"; const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const RETRIEVED = (() => { const r = D.svmeta.retrieved; return !r ? "–" : r[0] === r[1] ? longDate(r[0]) : `${longDate(r[0])} to ${longDate(r[1])}`; })();
const EXT = 'target="_blank" rel="noopener"';
const SCOPUS = `<a href="https://www.scopus.com" ${EXT}>Scopus</a>`, SCIVAL = `<a href="https://www.scival.com" ${EXT}>SciVal</a>`, ELSAPI = `<a href="https://api.elsevier.com" ${EXT}>api.elsevier.com</a>`;
const elsSrc = (what = "both") => `<p class="note src">Source: ${what === "scival" ? SCIVAL : what === "scopus" ? SCOPUS : `${SCOPUS} and ${SCIVAL}`} (Elsevier B.V.), via ${ELSAPI}, retrieved ${RETRIEVED}${what !== "scopus" ? `; SciVal data release ${longDate(D.svmeta.release)}` : ""}. Used under the University of Auckland's subscription.</p>`;
const scopusUrl = id => `https://www.scopus.com/inward/record.uri?partnerID=HzOxMe3b&amp;scp=${encodeURIComponent(id)}&amp;origin=inward`;
const pill = v => v === "y" ? '<span class="pill y">y</span>' : v === "n" ? '<span class="pill n">n</span>' : v === "?" ? '<span class="pill q">?</span>' : '<span class="muted">–</span>';
const TIER = { f: "Pacific-focused", p: "Pacific peoples within a wider study", m: "Single passing mention" };

// ------------------------------------------------------------------ filters
const F = { lens: { P: true, O: true, A: true }, tier: { f: true, p: false, m: false } };
const po = w => (w.lens & 1 && F.lens.P) || (w.lens & 2 && F.lens.O);
function passes(w) {
  if (w.tier && F.tier[w.tier] && po(w)) return true;
  return !!(w.lens & 4) && F.lens.A;
}
function category(w) { return (w.tier && F.tier[w.tier] && po(w)) ? w.tier : "a"; }
let FW = [];                    // filtered work indices
let authWorks = A.map(() => []); // author -> filtered work indices
function recompute() {
  FW = []; authWorks = A.map(() => []);
  W.forEach((w, i) => { if (passes(w)) { FW.push(i); w.a.forEach(a => authWorks[a].push(i)); } });
}
function renderFilters() {
  const n = k => W.filter(w => k(w)).length;
  const lens = [["P", "Pacific Islands & peoples", w => w.lens & 1], ["O", "Pacific Ocean & region", w => w.lens & 2], ["A", "Aotearoa environment & hazards", w => w.lens & 4]];
  const tiers = [["f", "Pacific-focused"], ["p", "Within wider studies"], ["m", "Single mentions"]];
  $("filters").innerHTML = `<div class="grp"><span class="lab">Lenses</span>${lens.map(([k, l, f]) => `<button class="chip" data-lens="${k}" aria-pressed="${F.lens[k]}" title="${esc(LENS_HELP[k])}">${l} <span class="n">${fmt(n(f))}</span></button>`).join("")}</div>
    <div class="grp"><span class="lab">Strength</span>${tiers.map(([k, l]) => `<button class="chip" data-tier="${k}" aria-pressed="${F.tier[k]}" title="${esc(TIER_HELP[k])}">${l} <span class="n">${fmt(n(w => w.tier === k))}</span></button>`).join("")}</div>
    <div class="readout" id="readout"></div>`;
  $("filters").querySelectorAll("[data-lens]").forEach(b => b.onclick = () => { F.lens[b.dataset.lens] = !F.lens[b.dataset.lens]; update(); });
  $("filters").querySelectorAll("[data-tier]").forEach(b => b.onclick = () => { F.tier[b.dataset.tier] = !F.tier[b.dataset.tier]; update(); });

      <div style="display:flex;gap:2px;height:22px;margin-top:4px">${["c", "s", "n", "x"].map(k => c[k] ? `<div style="flex:${c[k]};background:${ST_COLOR[k]};border-radius:3px" data-tip="<b>${ST[k]}</b><br>${esc(ST_LONG[k])}<br>${fmt(c[k])} works (${pct(c[k], n)}%)"></div>` : "").join("")}</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:.8125rem;color:var(--ink-3);margin-top:4px">${["c", "s", "n", "x"].map(k => `<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${ST_COLOR[k]};margin-right:5px"></i>${pct(c[k], n)}% ${ST_LOW[k]}</span>`).join("")}</div></div>`; };
  const byT = {}; focus.forEach(i => { const t = W[i].sv[1]; if (t >= 0) (byT[t] || (byT[t] = [])).push(i); });
  const tRows = Object.entries(byT).map(([t, idx]) => ({ t: +t, idx })).sort((a, b) => b.idx.length - a.idx.length || ST_T[b.t].uoa - ST_T[a.t].uoa);
  const xv = {}; focus.forEach(i => { if (W[i].sv[2] === "x") { const v = W[i].v || "No venue recorded"; xv[v] = (xv[v] || 0) + 1; } });
  const xRows = Object.entries(xv).sort((a, b) => b[1] - a[1]);
  const xt = {}; focus.forEach(i => { if (W[i].sv[2] === "x") { const t = (W[i].ty || "other").replace(/-/g, " "); xt[t] = (xt[t] || 0) + 1; } });
  const xTypes = Object.entries(xt).sort((a, b) => b[1] - a[1]);
  const nTop = SV.filter(r => r.kind === "topic"), nCl = SV.filter(r => r.kind === "cluster");
  const probes = D.probes.probes;
  const yrs = "2021–25";
  const shownByT = {}; FW.forEach(i => { const t = W[i].sv[1]; if (t >= 0) shownByT[t] = (shownByT[t] || 0) + 1; });
  el.innerHTML = `<h1>How this research lines up with the SRA's SciVal topics</h1>
    <p class="lead">In 2025 Research Services built the SRA datasets in SciVal: of all ${fmt(1423)} Topic Clusters and the ${fmt(452)} key Topics at UoA for 2020–2024, they kept the highest-performing on five measures (output, share, growth, FWCI, world prominence), hand-screened those for each SRA, and the narrative team corrected the lists. Here each work is looked up in Scopus and placed in its own SciVal Topic and Topic Cluster, then checked against that list.</p>
    ${elsSrc()}
    <div class="tiles">
      <div class="tile"><b>${pct(cf.c, nf)}%</b><span>of the Pacific works shown are in the SRA dataset: their SciVal Topic or Topic Cluster was included</span></div>
      <div class="tile"><b>${pct(cf.s, nf)}%</b><span>sit in a Topic or Cluster that was screened and marked “n” (some were left to other SRAs)</span></div>
      <div class="tile"><b>${pct(cf.n, nf)}%</b><span>sit in Topics and Clusters never screened: outside UoA's highest-performing areas, so the screening never saw them</span></div>
      <div class="tile"><b>${pct(cf.x, nf)}%</b><span>have no Scopus record (or no SciVal Topic yet), so no dataset built in SciVal can include them</span></div>
    </div>
    <h2>Where the works shown sit</h2>
    ${bar(cf, "Pacific Islands, peoples and ocean (lenses P and O, at the chosen strength)")}${bar(ca, "Aotearoa environment & hazards only (lens A)")}
    <p class="note">How this is worked out: each work's DOI (or, failing that, its exact title and year) is looked up in Scopus, and SciVal returns the Topic and Topic Cluster it belongs to. A SciVal research area built from Topics and Topic Clusters holds every paper in them, so a work is in the SRA dataset when its Topic or its Cluster was included. ${fmt(SVL.sra.filter(r => r.sid != null).length)} of the ${fmt(SV.length)} names on the SRA3 list were found in SciVal today${SVL.unmatched.length ? ` (${SVL.unmatched.length} not found: SciVal has since renamed or merged them)` : ""}.</p>

    <h2>SciVal Topics holding the Pacific works shown</h2>
    <p class="note">UoA and world output are SciVal's counts for ${yrs} across all research in the Topic, not only Pacific research. UoA FWCI in the Topic (from SciVal) is shown where the Topic holds at least two Pacific-focused works. Prominence percentile ranks the Topic's worldwide momentum.</p>
    <div class="toolbar"><input id="gtQ" type="search" placeholder="Filter Topic names" aria-label="Filter Topics" value="${esc(GP.tq)}">
      <select id="gtSt" aria-label="Status"><option value="">Any status</option>${["c", "s", "n"].map(k => `<option value="${k}" ${GP.tst === k ? "selected" : ""}>${ST[k]}</option>`).join("")}</select></div>
    <div class="tablewrap"><table><thead><tr><th>SciVal Topic · Cluster</th><th class="num">Works here</th><th class="num">UoA ${yrs}</th><th class="num">World ${yrs}</th><th class="num">UoA share</th><th class="num">UoA FWCI</th><th class="num">Prominence</th><th>SRA status</th></tr></thead><tbody id="gtBody"></tbody></table></div>
    <p class="toolbar"><button class="btn" id="gtMore"></button><span class="note" id="gtCount"></span></p>

    <h2>Where Pacific Island researchers publish, and UoA's place in it</h2>
    <p class="note">The ${fmt(SVL.pic_rank.length)} SciVal Topics with the most ${yrs} output from authors in Pacific Island countries and territories (${esc(Object.values(SVL.pic_countries).sort((a, b) => b.n - a.n).slice(0, 5).map(c => c.name).join(", "))} and ${Object.keys(SVL.pic_countries).length - 5} more), with UoA's output in each. This is research done by authors based in those countries, on any subject (one Topic is led by a robotics group in Fiji), not only research about the Pacific. Country counts are summed, so a paper with authors in two Pacific countries counts twice and the sum can exceed the Topic's world total; large consortium papers also land here. Topics where UoA has little or no output are candidate gaps or partnership openings.</p>
    <div class="toolbar"><select id="gpPic" aria-label="UoA output"><option value="">All of these Topics</option><option value="low" ${GP.pic === "low" ? "selected" : ""}>UoA has 2 or fewer papers</option><option value="high" ${GP.pic === "high" ? "selected" : ""}>UoA has 10 or more papers</option></select>
      <select id="gpPicSort" aria-label="Sort"><option value="pic" ${GP.picSort === "pic" ? "selected" : ""}>Sort by Pacific Island output</option><option value="share" ${GP.picSort === "share" ? "selected" : ""}>Sort by Pacific Island output relative to the Topic's size</option><option value="uoa" ${GP.picSort === "uoa" ? "selected" : ""}>Sort by UoA output</option></select></div>
    <div class="tablewrap"><table><thead><tr><th>SciVal Topic</th><th class="num">Pacific Island ${yrs}</th><th class="num">World ${yrs}</th><th class="num">UoA ${yrs}</th><th>SRA status</th><th class="num">Works shown here</th></tr></thead><tbody id="gpPicBody"></tbody></table></div>
    <p class="toolbar"><button class="btn" id="gpPicMore"></button><span class="note" id="gpPicCount"></span></p>

    <h2>SciVal Topics named for the Pacific</h2>
    <p class="note">Every Topic in UoA's SciVal portfolio (${yrs}) whose name names a Pacific place, people, or the Pacific Ocean and its climate, with its SRA status. A Topic marked “n” can still be in the SRA dataset when its Cluster was included (hover the status).</p>
    <div class="tablewrap" style="max-height:420px;overflow:auto"><table><thead><tr><th>SciVal Topic · Cluster</th><th class="num">UoA ${yrs}</th><th class="num">World ${yrs}</th><th class="num">Works shown here</th><th>SRA status</th></tr></thead><tbody>
      ${SVL.pac_named.map(t => ({ t, x: ST_T[t] })).sort((a, b) => b.x.uoa - a.x.uoa).map(({ t, x }) => `<tr><td><button class="linkbtn" data-svt="${t}">${esc(x.name)}</button>${x.cl >= 0 ? `<br><small>${esc(ST_C[x.cl].name)}</small>` : ""}</td>
        <td class="num">${fmt(x.uoa)}</td><td class="num">${x.world == null ? "–" : fmt(x.world)}</td><td class="num">${fmt(shownByT[t] || 0)}</td><td>${stPill(x.st, stWhy(t))}</td></tr>`).join("")}
    </tbody></table></div>

    <h2>Keyword probes</h2>
    <p class="note">The automation for testing new keywords against SciVal. Each probe searches Scopus (${esc(D.probes.years)}) for the terms together with the Pacific search terms, then asks SciVal which Topics the ${fmt(D.probes.sample)} most relevant papers (world) and UoA's own papers (up to ${fmt(D.probes.sample)}) belong to, and whether those Topics are in the SRA dataset. <b>The probes shown are examples only: themes named on the Blue Pacific Horizons web page.</b> Replace them with the SRA's own list of missing areas (one line each in <span class="mono">bph/probes.txt</span>) and rerun <span class="mono">probe_keywords.py</span>.</p>
    <div class="tablewrap"><table><thead><tr><th>Probe</th><th class="num">UoA, all</th><th class="num">UoA, Pacific</th><th class="num">World, Pacific</th><th class="num">UoA share</th><th class="num">UoA's in SRA dataset</th><th>Main SciVal Topics</th></tr></thead><tbody>
      ${probes.map((p, k) => `<tr><td><button class="linkbtn" data-probe="${k}">${esc(p.label)}</button><br><small>${esc(p.terms.join(" · "))}</small></td>
        <td class="num">${fmt(p.uoa_all)}</td><td class="num">${fmt(p.uoa_pac)}</td><td class="num">${fmt(p.world_pac)}</td><td class="num">${p.share == null ? "–" : p.share.toFixed(1) + "%"}</td>
        <td class="num">${p.n_u ? `${pct(p.in_u, p.n_u)}% <small>of ${fmt(p.n_u)}</small>` : "–"}</td>
        <td>${p.topics.slice(0, 3).map(t => `${t.ix >= 0 ? `<button class="linkbtn" data-svt="${t.ix}">${esc(t.name)}</button>` : esc(t.name)} ${stPill(t.st)} <small class="mono">${t.w} world · ${t.u} UoA</small>`).join("<br>")}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note">"Pacific" counts use the Pacific search terms (lenses P and O) in Scopus before this atlas's own checks, so UoA and world are counted the same way. "UoA's in SRA dataset" is the share of UoA's Pacific papers on the theme whose Topic or Cluster is included.</p>

    <h2>Pacific research SciVal cannot see</h2>
    <p class="note">${fmt(cf.x)} of the ${fmt(nf)} Pacific works shown have no Scopus record (or no SciVal Topic yet): conference abstracts, book chapters, some regional journals and the newest papers. Any SciVal-based dataset misses them. By type: ${esc(xTypes.map(([t, n]) => `${t} ${fmt(n)}`).join(" · ")) || "none"}. Where they were published:</p>
    <div class="tablewrap" style="max-height:360px;overflow:auto"><table><thead><tr><th>Venue</th><th class="num">Works</th></tr></thead><tbody>
      ${xRows.slice(0, 40).map(([v, n]) => `<tr><td>${esc(v)}</td><td class="num">${fmt(n)}</td></tr>`).join("") || '<tr><td colspan="2" class="muted">None under the current filters.</td></tr>'}
    </tbody></table></div>

    <h2>The full screened list</h2>
    <div class="toolbar"><input id="gpQ" type="search" placeholder="Filter SciVal names" aria-label="Filter SciVal list" value="${esc(GP.q)}">
      <select id="gpKind" aria-label="Kind"><option value="">Topics and Clusters</option><option value="topic" ${GP.kind === "topic" ? "selected" : ""}>Topics</option><option value="cluster" ${GP.kind === "cluster" ? "selected" : ""}>Topic Clusters</option></select>
      <select id="gpStatus" aria-label="Status"><option value="">Included and excluded</option><option value="y" ${GP.status === "y" ? "selected" : ""}>Included</option><option value="n" ${GP.status === "n" ? "selected" : ""}>Excluded</option></select></div>
    <div class="tablewrap" style="max-height:520px;overflow:auto"><table><thead><tr><th>SciVal name</th><th>Kind</th><th>Research Services</th><th>Narrative team</th><th>Final</th><th class="num">UoA ${yrs}</th><th class="num">Works shown here</th></tr></thead><tbody id="gpBody"></tbody></table></div>
    <p class="note">From the SRA3 Topics &amp; Topic Clusters list prepared by Research Services for the Research and Innovation Office (sheet headings "Pacific Futures"): ${fmt(nTop.filter(r => r.final === "y").length)} of ${fmt(nTop.length)} Topics and ${fmt(nCl.filter(r => r.final === "y").length)} of ${fmt(nCl.length)} Topic Clusters included (the methodology note says 267 Topics). "Final" is the narrative team's call where they gave one, otherwise Research Services'. "Works shown here" counts works under the current filters whose SciVal Topic is this Topic, or whose Topic sits in this Cluster.</p>`;

  const tb1 = () => {
    const q = fold(GP.tq);
    const rows = tRows.filter(r => (!GP.tst || ST_T[r.t].st === GP.tst) && (!q || fold(ST_T[r.t].name).includes(q) || (ST_T[r.t].cl >= 0 && fold(ST_C[ST_T[r.t].cl].name).includes(q))));
    const shown = GP.tAll ? rows : rows.slice(0, 25);
    $("gtBody").innerHTML = shown.map(r => { const x = ST_T[r.t], cl = x.cl >= 0 ? ST_C[x.cl] : null;
      return `<tr><td><button class="linkbtn" data-svt="${r.t}">${esc(x.name)}</button>${cl ? `<br><small>${esc(cl.name)}</small>` : ""}</td><td class="num">${fmt(r.idx.length)}</td>
        <td class="num">${fmt(x.uoa)}</td><td class="num">${x.world == null ? "–" : fmt(x.world)}</td><td class="num">${x.world ? (100 * x.uoa / x.world).toFixed(1) + "%" : "–"}</td>
        <td class="num">${x.fwci == null ? "–" : x.fwci.toFixed(2)}</td><td class="num">${x.prom == null ? "–" : x.prom.toFixed(0)}</td><td>${stPill(x.st, stWhy(r.t))}</td></tr>`; }).join("") || '<tr><td colspan="8" class="muted">None under the current filters.</td></tr>';
    $("gtMore").hidden = rows.length <= 25; $("gtMore").textContent = GP.tAll ? "Show the top 25" : `Show all ${fmt(rows.length)}`;
    $("gtCount").textContent = `${fmt(rows.length)} Topics`;
    wireCommon($("gtBody"));
  };
  const tb2 = () => {
    let rows = SVL.pic_rank.map(t => ({ t, x: ST_T[t] })).filter(r => !GP.pic || (GP.pic === "low" ? r.x.uoa <= 2 : r.x.uoa >= 10));
    const key = { pic: r => r.x.pic, share: r => r.x.world ? r.x.pic / r.x.world : 0, uoa: r => r.x.uoa }[GP.picSort];
    rows.sort((a, b) => key(b) - key(a));
    const shown = GP.picAll ? rows : rows.slice(0, 25);
    $("gpPicBody").innerHTML = shown.map(({ t, x }) => `<tr><td><button class="linkbtn" data-svt="${t}">${esc(x.name)}</button>${x.cl >= 0 ? `<br><small>${esc(ST_C[x.cl].name)}</small>` : ""}
        <br><small>Pacific Island authors: ${esc(x.picc.map(([c, n]) => `${SVL.pic_countries[c].name} ${n}`).join(" · "))}</small></td>
      <td class="num">${fmt(x.pic)}</td>
      <td class="num">${x.world == null ? "–" : fmt(x.world)}</td><td class="num">${fmt(x.uoa)}</td><td>${stPill(x.st, stWhy(t))}</td><td class="num">${fmt(shownByT[t] || 0)}</td></tr>`).join("") || '<tr><td colspan="6" class="muted">None.</td></tr>';
    $("gpPicMore").hidden = rows.length <= 25; $("gpPicMore").textContent = GP.picAll ? "Show the top 25" : `Show all ${fmt(rows.length)}`;
    $("gpPicCount").textContent = `${fmt(rows.length)} Topics`;
    wireCommon($("gpPicBody"));
  };
  const svCount = j => { const r = SVL.sra[j]; if (r.ix < 0) return 0;
    return r.kind === "topic" ? (shownByT[r.ix] || 0) : Object.entries(shownByT).reduce((s, [t, n]) => s + (ST_T[t].cl === r.ix ? n : 0), 0); };
  const svUoa = j => { const r = SVL.sra[j]; if (r.ix < 0) return null; return r.kind === "topic" ? ST_T[r.ix].uoa : ST_C[r.ix].uoa; };
  const tb3 = () => {
    const q = fold(GP.q);
    $("gpBody").innerHTML = SV.map((r, j) => ({ r, j })).filter(({ r }) => (!GP.kind || r.kind === GP.kind) && (!GP.status || r.final === GP.status) && (!q || fold(r.name).includes(q)))
      .map(({ r, j }) => { const u = svUoa(j); return `<tr><td><button class="linkbtn" data-sv="${j}">${esc(r.name)}</button></td><td>${r.kind}</td><td>${pill(r.rs)}</td><td>${pill(r.sme)}</td><td>${pill(r.final)}</td>
        <td class="num">${u == null ? '<span class="muted" data-tip="Not found in SciVal today">–</span>' : fmt(u)}</td><td class="num">${fmt(svCount(j))}</td></tr>`; }).join("");
    wireCommon($("gpBody"));
  };
  $("gtQ").oninput = e => { GP.tq = e.target.value; tb1(); };
  $("gtSt").onchange = e => { GP.tst = e.target.value; tb1(); };
  $("gtMore").onclick = () => { GP.tAll = !GP.tAll; tb1(); };
  $("gpPic").onchange = e => { GP.pic = e.target.value; tb2(); };
  $("gpPicSort").onchange = e => { GP.picSort = e.target.value; tb2(); };
  $("gpPicMore").onclick = () => { GP.picAll = !GP.picAll; tb2(); };
  $("gpQ").oninput = e => { GP.q = e.target.value; tb3(); };
  $("gpKind").onchange = e => { GP.kind = e.target.value; tb3(); };
  $("gpStatus").onchange = e => { GP.status = e.target.value; tb3(); };
  tb1(); tb2(); tb3(); wireCommon(el);
}

// ================================================================== ABOUT
function renderAbout() {
  const el = $("v-about"); if (el.dataset.built) return; el.dataset.built = "1";
  const cv = D.coverage;
  const inScopus = W.filter(w => w.sv[0]).length, byTitle = W.filter(w => w.sv[5] === "title").length, inSv = W.filter(w => w.sv[1] >= 0).length;
  const svFound = SVL.sra.filter(r => r.sid != null).length;
  el.innerHTML = `<h1>About this landscape</h1>
    <p class="lead">A first pass at mapping the University of Auckland's research in or about the Pacific, for Mā Kiwa te moana nui e whakaumu | Blue Pacific Horizons, built by the Centre for eResearch from OpenAlex (open data) and the University's Scopus and SciVal subscription.</p>
    <div class="cols"><div>
      <h2>What counts as Pacific research here</h2>
      <p>Works with at least one University of Auckland author, 2020 to ${esc(BUILT)}, from OpenAlex. A work is in when it falls in one of three lenses:</p>
      <ul><li><b>Pacific Islands &amp; peoples:</b> ${esc(LENS_HELP.P)}</li><li><b>Pacific Ocean &amp; region:</b> ${esc(LENS_HELP.O)}</li><li><b>Aotearoa environment &amp; hazards:</b> ${esc(LENS_HELP.A)} This follows the SRA's framing of Aotearoa as part of the Pacific region.</li></ul>
      <p>OpenAlex search finds ${fmt(cv.candidates)} candidates; each is then checked against its title, abstract and keywords. False friends are dropped ("Asia-Pacific", "Indo-Pacific", the WHO Western Pacific Region, "Pacific oyster", the Canada-France-Hawaii Telescope). ${fmt(cv.kept)} pass; ${fmt(cv.dropped)} do not (${fmt(cv.dropped_no_abstract)} of those had no abstract to check, because some publishers withhold them from OpenAlex).</p>
      <h3>Strength</h3>
      <ul><li><b>Pacific-focused</b> (${fmt(cv.tiers.f)}): ${esc(TIER_HELP.f)}</li><li><b>Within wider studies</b> (${fmt(cv.tiers.p)}): ${esc(TIER_HELP.p)}</li><li><b>Single mention</b> (${fmt(cv.tiers.m)}): ${esc(TIER_HELP.m)}</li></ul>
      <p>The default view shows Pacific-focused works plus the Aotearoa lens. Works within wider studies and single mentions are off by default; switch them on above.</p>
      <p>Spot check: in a random sample of 40 Pacific-focused works, 38 were plainly research in or about the Pacific; the other two named Pacific climate modes or Pacific athletes in passing. In a random sample of 25 works from the Aotearoa lens alone, 24 were environment, ocean or hazards research; the other studied sustainability attitudes.</p>
      <h2>Sources</h2>
      <ul><li><b>OpenAlex</b> (CC0): works, authorships and affiliations, topics, citations, FWCI and top-10% flags, funders, SDGs, institutions and their locations; and public award records (HRC research repository, Marsden Fund lists, MBIE "who got funded", and overseas funders).</li>
        <li><b>Scopus and SciVal</b> (Elsevier B.V.; ${SCOPUS}, ${SCIVAL}; data retrieved through ${ELSAPI} on ${RETRIEVED}, SciVal data release ${longDate(D.svmeta.release)}; used under the University of Auckland's subscription): each work's Scopus record, SciVal Topic and Topic Cluster, SciVal FWCI; UoA's SciVal output by Topic and Cluster for ${D.svmeta.start}–${D.svmeta.end}; the Topics of ${Object.keys(SVL.pic_countries).length} Pacific Island countries and territories; and the keyword probes. These data are for University use under the licence: share this page within the University only.</li>
        <li><b>SRA3 SciVal Topics &amp; Topic Clusters</b>, with the SciVal dataset methodology, prepared by Research Services for the Research and Innovation Office.</li>
        <li><b>Not included:</b> non-public data from the University's grant and ethics application systems. It is managed by the Research and Innovation Office for consent and privacy reasons and would need their permission.</li></ul>
    </div><div>
      <h2>Read it with care</h2>
      <p>The atlas is built from OpenAlex, which indexes more than Scopus: ${fmt(inScopus)} of its ${fmt(W.length)} works have a Scopus record (${fmt(inScopus - byTitle)} found by DOI, ${fmt(byTitle)} by exact title and year), and ${fmt(inSv)} have a SciVal Topic. The rest are mostly conference abstracts, preprints, datasets, book chapters and papers in regional journals Scopus does not index; they are counted as "Not in SciVal" on the alignment tab. OpenAlex and SciVal FWCI differ because their databases differ. About 1.5% of the atlas's records duplicate another (a preprint and its article, a chapter listed twice); counts are of OpenAlex records.</p>
      <p>SciVal figures cover its current five complete years (${D.svmeta.start}–${D.svmeta.end}); the 2025 SRA screening used 2020–2024. SciVal Topics are stable, but ${fmt(SV.length - svFound)} of the ${fmt(SV.length)} names on the SRA3 list were not found in SciVal today${SVL.unmatched.length ? ` (${esc(SVL.unmatched.slice(0, 3).join("; "))}${SVL.unmatched.length > 3 ? "; …" : ""})` : ""}.</p>
      <p>Faculty and unit come from affiliation text (${pct(cv.authors_with_faculty, cv.authors)}% of researchers matched) and author identities from OpenAlex's automated disambiguation; both will contain errors. ${fmt(cv.no_abstract)} works have no abstract in OpenAlex and were judged on title and keywords.</p>
      <p>Award coverage is uneven: Marsden Fund records in OpenAlex stop at 2017, HRC records carry no end dates, and ${fmt(2074)} HRC awards record no lead institution, so some UoA awards are missing.</p>
      <p>Bibliometrics see published, indexed work. They miss community reports, much Pacific-language scholarship, and the relationships behind the research. Use these numbers to prompt conversations, not to rank people.</p>
      <h2>Next steps for the pilot</h2>
      <ol><li>Load the SRA's list of missing areas as keyword probes; review the SciVal Topics they land in together.</li>
        <li>With the Research and Innovation Office, decide which never-screened and screened-out Pacific Topics should join the SRA dataset in SciVal, and refresh it for ${D.svmeta.start}–${D.svmeta.end}.</li>
        <li>Refine faculty and unit mapping and author identities for key researchers.</li>
        <li>If approved by the Research and Innovation Office, add grants, active projects and ethics data; then a gap analysis against the SRA's goals.</li></ol>
      <p class="note">Built ${esc(BUILT)} from the pipeline in <span class="mono">bph/pipeline</span> (run_all.sh). Rank among universities: ${esc(D.world.p_universities.slice(0, 5).map((u, k) => `${k + 1}. ${u[0]}`).join("; "))}.</p>
    </div></div>`;
}

const drawer = $("drawer");
function openDrawer(html) { drawer.innerHTML = `<button class="close" id="drClose" aria-label="Close">×</button>` + html; drawer.hidden = false; $("drClose").onclick = () => drawer.hidden = true; wireCommon(drawer); drawer.scrollTop = 0; }
function facts(items) { return `<div class="facts">${items.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>`; }
function openWork(i) {
  const w = W[i], t = T[w.tp], sv = w.sv, st = sv[1] >= 0 ? ST_T[sv[1]] : null;
  openDrawer(`<div class="kind">${esc(TIER[w.tier] || "Aotearoa environment & hazards")}</div><h2>${esc(w.t)}</h2>
    <p class="meta">${w.y} · ${esc(w.v || w.ty || "")}</p>
    ${facts([[fmt(w.c), "citations (OpenAlex)"], [w.fwci == null ? "–" : w.fwci.toFixed(2), "FWCI (OpenAlex)"], [w.top10 ? "yes" : "no", "top 10% most cited (OpenAlex)"], [fmt(w.na), "authors"]])}
    <h3>Why it is here</h3><p class="meta">${esc(w.ev.join("; "))}</p>
    ${w.places.length ? `<p class="meta">Places and peoples named: ${esc(w.places.map(placeLabel).join(", "))}</p>` : ""}
    ${t ? `<h3>Topic</h3><p class="meta"><button class="linkbtn" data-topic="${w.tp}">${esc(t.name)}</button><br><span class="muted">${esc(t.sub)} · ${esc(t.field)}</span></p>` : ""}
    <h3>In SciVal</h3>${st ? `<p class="meta">Topic: <button class="linkbtn" data-svt="${sv[1]}">${esc(st.name)}</button>${st.cl >= 0 ? `<br>Topic Cluster: ${esc(ST_C[st.cl].name)}` : ""}</p>
      <p class="meta">${stPill(sv[2])} <span class="muted">${esc(stWhy(sv[1]))}</span></p>
      ${facts([[sv[3] == null ? "–" : sv[3].toFixed(2), "FWCI (SciVal)"], [sv[4] == null ? "–" : sv[4] ? "yes" : "no", "top 10% most cited (SciVal)"]])}${elsSrc()}`
      : `<p class="meta">${stPill("x")} <span class="muted">${sv[0] ? "In Scopus, but SciVal has not assigned it a Topic yet." : "No Scopus record found by DOI or exact title, so SciVal cannot see it."}</span></p>${elsSrc()}`}
    ${w.ab ? `<h3>Abstract</h3><p class="abstract">${esc(w.ab)}</p>` : ""}
    <h3>UoA authors</h3><ul class="list">${w.a.map(a => authorItem(a)).join("") || "<li class='muted'>None recorded</li>"}</ul>
    ${w.ext.length ? `<h3>Partner institutions</h3><ul class="list">${w.ext.slice(0, 15).map(e => `<li><button data-inst="${e}">${esc(I[e].name)}<small>${esc([I[e].city, I[e].cc].filter(Boolean).join(", "))}</small></button></li>`).join("")}</ul>` : ""}
    ${w.aw.length ? `<h3>Awards</h3><ul class="list">${w.aw.map(k => `<li><button data-award="${k}">${esc(AW[k].t)}<small>${esc(AW[k].f)}</small></button></li>`).join("")}</ul>` : ""}
    <div class="btnrow">${w.doi ? `<a class="btn" href="${esc(w.doi)}" target="_blank" rel="noopener">DOI</a>` : ""}<a class="btn" href="https://openalex.org/${esc(w.id)}" target="_blank" rel="noopener">OpenAlex record</a>${sv[0] ? `<a class="btn" href="${scopusUrl(sv[0])}" target="_blank" rel="noopener" aria-label="view on Scopus">View on Scopus</a>` : ""}${w.oa ? `<a class="btn" href="${esc(w.oa)}" target="_blank" rel="noopener">Open-access copy</a>` : ""}</div>`);
}
function openAuthor(ai) {
  const a = A[ai], ws = authWorks[ai].slice().sort(byCites), all = W.map((w, i) => w.a.includes(ai) ? i : -1).filter(i => i >= 0);
  const co = {}; ws.forEach(i => W[i].a.forEach(b => { if (b !== ai) co[b] = (co[b] || 0) + 1; }));
  openDrawer(`<div class="kind">UoA researcher</div><h2>${esc(a.name)}</h2>
    <p class="meta">${esc(a.faculty || "Faculty not recorded")}${a.unit ? "<br>" + esc(a.unit) : ""}${a.orcid ? `<br><a href="${esc(a.orcid)}" target="_blank" rel="noopener">ORCID</a>` : ""}</p>
    ${facts([[fmt(ws.length), "works under the filters"], [fmt(all.length), "works in the atlas"], [fmt(a.nf), "Pacific-focused"], [a.fwci == null ? "–" : a.fwci.toFixed(2), "mean FWCI, OpenAlex (all their works here)"]])}
    ${a.topics.length ? `<h3>Main topics</h3><p class="meta">${a.topics.map(t => `<button class="linkbtn" data-topic="${t}">${esc(T[t].name)}</button>`).join("<br>")}</p>` : ""}
    <h3>Works</h3><ul class="list">${(ws.length ? ws : all).slice(0, 15).map(workItem).join("")}</ul>
    ${Object.keys(co).length ? `<h3>UoA co-authors here</h3><ul class="list">${Object.entries(co).sort((x, y) => y[1] - x[1]).slice(0, 10).map(([b, n]) => authorItem(+b, `${n} shared work${n > 1 ? "s" : ""}`)).join("")}</ul>` : ""}
    <div class="btnrow"><a class="btn" href="https://openalex.org/${esc(a.id)}" target="_blank" rel="noopener">OpenAlex profile</a></div>`);
}
function openInst(e) {
  const it = I[e], ws = FW.filter(i => W[i].ext.includes(e)).sort(byCites);
  const people = {}; ws.forEach(i => W[i].a.forEach(a => people[a] = (people[a] || 0) + 1));
  openDrawer(`<div class="kind">Partner institution · ${esc(it.region)}</div><h2>${esc(it.name)}</h2><p class="meta">${esc([it.city, it.cc].filter(Boolean).join(", "))}${it.type ? " · " + esc(it.type) : ""}</p>
    ${facts([[fmt(ws.length), "works with UoA under the filters"], [fmt(Object.keys(people).length), "UoA researchers involved"]])}
    <h3>UoA researchers</h3><ul class="list">${Object.entries(people).sort((x, y) => y[1] - x[1]).slice(0, 12).map(([a, n]) => authorItem(+a, `${n} joint work${n > 1 ? "s" : ""}`)).join("")}</ul>
    <h3>Works</h3><ul class="list">${ws.slice(0, 15).map(workItem).join("")}</ul>`);
}
function openPlace(c) {
  const p = PLACE[c], ws = FW.filter(i => W[i].places.includes(c)).sort(byCites);
  const people = {}; ws.forEach(i => W[i].a.forEach(a => people[a] = (people[a] || 0) + 1));
  const tp = {}; ws.forEach(i => { if (W[i].tp >= 0) tp[W[i].tp] = (tp[W[i].tp] || 0) + 1; });
  openDrawer(`<div class="kind">Place or people named</div><h2>${esc(p.label)}</h2>
    ${facts([[fmt(ws.length), "works under the filters"], [fmt(Object.keys(people).length), "UoA researchers"]])}
    <h3>Topics</h3><p class="meta">${Object.entries(tp).sort((x, y) => y[1] - x[1]).slice(0, 6).map(([t, n]) => `<button class="linkbtn" data-topic="${t}">${esc(T[t].name)}</button> <span class="mono muted">${n}</span>`).join("<br>")}</p>
    <h3>Researchers</h3><ul class="list">${Object.entries(people).sort((x, y) => y[1] - x[1]).slice(0, 10).map(([a, n]) => authorItem(+a, `${n} work${n > 1 ? "s" : ""}`)).join("")}</ul>
    <h3>Works</h3><ul class="list">${ws.slice(0, 15).map(workItem).join("")}</ul>`);
}
function openTopic(t) {
  const tt = T[t], ws = FW.filter(i => W[i].tp === t).sort(byCites), pr = svProfile(ws);
  const people = {}; ws.forEach(i => W[i].a.forEach(a => people[a] = (people[a] || 0) + 1));
  openDrawer(`<div class="kind">OpenAlex topic</div><h2>${esc(tt.name)}</h2><p class="meta">${esc(tt.sub)} · ${esc(tt.field)} · ${esc(tt.domain)}</p>
    ${facts([[fmt(ws.length), "works under the filters"], [fmt(Object.keys(people).length), "UoA researchers"]])}
    ${ws.length ? `<h3>Against the SRA's SciVal list</h3><p class="meta">${["c", "s", "n", "x"].filter(k => pr.st[k]).map(k => `${fmt(pr.st[k])} ${ST_LOW[k]}`).join("<br>")}</p>
      ${pr.topics.length ? `<p class="meta">Their SciVal Topics:<br>${pr.topics.slice(0, 5).map(([s, n]) => `<button class="linkbtn" data-svt="${s}">${esc(ST_T[s].name)}</button> ${stPill(ST_T[s].st)} <span class="mono muted">${n}</span>`).join("<br>")}</p>` : ""}${elsSrc()}` : ""}
    <h3>Researchers</h3><ul class="list">${Object.entries(people).sort((x, y) => y[1] - x[1]).slice(0, 10).map(([a, n]) => authorItem(+a, `${n} work${n > 1 ? "s" : ""}`)).join("")}</ul>
    <h3>Works</h3><ul class="list">${ws.slice(0, 20).map(workItem).join("")}</ul>
    <div class="btnrow"><a class="btn" href="https://openalex.org/${esc(tt.id)}" target="_blank" rel="noopener">OpenAlex topic</a></div>`);
}
function openSubfield(s) {
  const ws = FW.filter(i => T[W[i].tp] && T[W[i].tp].sub === s).sort(byCites);
  const tp = {}; ws.forEach(i => tp[W[i].tp] = (tp[W[i].tp] || 0) + 1);
  openDrawer(`<div class="kind">Subfield</div><h2>${esc(s)}</h2>${facts([[fmt(ws.length), "works under the filters (all years)"], [fmt(Object.keys(tp).length), "OpenAlex topics"]])}
    <h3>Topics</h3><p class="meta">${Object.entries(tp).sort((x, y) => y[1] - x[1]).slice(0, 12).map(([t, n]) => `<button class="linkbtn" data-topic="${t}">${esc(T[t].name)}</button> <span class="mono muted">${n}</span>`).join("<br>")}</p>
    <h3>Most cited works</h3><ul class="list">${ws.slice(0, 15).map(workItem).join("")}</ul>`);
}
function svWorks(kind, ix) {   // works under the filters in a SciVal Topic (kind "topic") or Topic Cluster
  return FW.filter(i => { const t = W[i].sv[1]; return t >= 0 && (kind === "topic" ? t === ix : ST_T[t].cl === ix); }).sort(byCites);
}
function svPeople(ws) { const p = {}; ws.forEach(i => W[i].a.forEach(a => p[a] = (p[a] || 0) + 1)); return Object.entries(p).sort((x, y) => y[1] - x[1]); }
function openSV(j) {
  const r = SV[j], m = SVL.sra[j], x = m.ix >= 0 ? (r.kind === "topic" ? ST_T[m.ix] : ST_C[m.ix]) : null;
  const ws = x ? svWorks(r.kind, m.ix) : [], people = svPeople(ws);
  openDrawer(`<div class="kind">SRA3 list · SciVal ${r.kind === "topic" ? "Topic" : "Topic Cluster"} · ${r.final === "y" ? "included" : "excluded"}</div><h2>${esc(r.name)}</h2>
    ${facts([[r.rs || "–", "Research Services call"], [r.sme || "–", "Narrative team call"], [r.final, "final"], [x ? fmt(x.uoa) : "–", "UoA output 2021–25 (SciVal)"]])}
    ${x ? `${r.kind === "topic" && x.cl >= 0 ? `<p class="meta">Topic Cluster: ${esc(ST_C[x.cl].name)}</p>` : ""}
      <p class="meta">World output ${x.world == null ? "–" : fmt(x.world)} · prominence percentile ${x.prom == null ? "–" : x.prom.toFixed(0)}${r.kind === "topic" ? ` · <button class="linkbtn" data-svt="${m.ix}">Topic details</button>` : ""}</p>`
      : `<p class="note">Not found in SciVal today under this name: SciVal may have renamed or merged it since the list was made.</p>`}
    <h3>Works shown here in this ${r.kind === "topic" ? "Topic" : "Cluster"}</h3><ul class="list">${ws.slice(0, 20).map(workItem).join("") || "<li class='muted'>None under the current filters.</li>"}</ul>
    ${people.length ? `<h3>UoA researchers</h3><ul class="list">${people.slice(0, 10).map(([a, n]) => authorItem(+a, `${n} work${n > 1 ? "s" : ""}`)).join("")}</ul>` : ""}
    ${elsSrc("scival")}`);
}
function openSVT(t) {
  const x = ST_T[t], cl = x.cl >= 0 ? ST_C[x.cl] : null, ws = svWorks("topic", t), people = svPeople(ws);
  openDrawer(`<div class="kind">SciVal Topic · ${ST[x.st]}</div><h2>${esc(x.name)}</h2>
    ${cl ? `<p class="meta">Topic Cluster: ${cl.sra >= 0 ? `<button class="linkbtn" data-sv="${cl.sra}">${esc(cl.name)}</button>` : esc(cl.name)}</p>` : ""}
    <p class="meta">${stPill(x.st)} <span class="muted">${esc(stWhy(t))}</span>${x.sra >= 0 ? ` · <button class="linkbtn" data-sv="${x.sra}">SRA3 entry</button>` : ""}</p>
    ${facts([[fmt(x.uoa), "UoA output 2021–25"], [x.world == null ? "–" : fmt(x.world), "world output 2021–25"], [x.world ? (100 * x.uoa / x.world).toFixed(1) + "%" : "–", "UoA share of the Topic"],
      [x.prom == null ? "–" : x.prom.toFixed(0), "prominence percentile"], [x.fwci == null ? "–" : x.fwci.toFixed(2), "UoA FWCI in the Topic"], [fmt(x.pic), "Pacific Island country output"]])}
    ${x.picc.length ? `<p class="meta">Pacific Island countries: ${esc(x.picc.map(([c, n]) => `${SVL.pic_countries[c].name} ${n}`).join(" · "))}</p>` : ""}
    <h3>Works shown here in this Topic</h3><ul class="list">${ws.slice(0, 20).map(workItem).join("") || "<li class='muted'>None under the current filters.</li>"}</ul>
    ${people.length ? `<h3>UoA researchers</h3><ul class="list">${people.slice(0, 10).map(([a, n]) => authorItem(+a, `${n} work${n > 1 ? "s" : ""}`)).join("")}</ul>` : ""}
    ${elsSrc("scival")}`);
}
function openAward(k) {
  const a = AW[k], ws = W.map((w, i) => w.aw.includes(k) ? i : -1).filter(i => i >= 0);
  openDrawer(`<div class="kind">Award · ${esc(a.f)}</div><h2>${esc(a.t)}</h2><p class="meta">${esc(a.scheme || "")}${a.fid ? " · " + esc(a.fid) : ""}</p>
    ${facts([[a.y0 || "–", "start year"], [a.end || "not published", "end"], [a.amt ? (a.cur === "NZD" ? "NZ$" : (a.cur || "") + " ") + fmt(Math.round(a.amt)) : "–", "amount"], [esc(a.lead || "–"), "lead investigator"]])}
    <p class="meta">${a.pac || a.pacp ? esc(a.ev.join("; ")) : "Linked through works in this atlas that acknowledge it."}</p>
    ${a.d ? `<h3>Description</h3><p class="abstract">${esc(a.d)}</p>` : ""}
    ${ws.length ? `<h3>Works in this atlas that acknowledge it</h3><ul class="list">${ws.map(workItem).join("")}</ul>` : ""}
    <div class="btnrow">${a.url ? `<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">Funder page</a>` : ""}<a class="btn" href="https://openalex.org/${esc(a.id)}" target="_blank" rel="noopener">OpenAlex record</a></div>`);
}
function openProbe(k) {
  const p = D.probes.probes[k];
  const yl = esc(D.probes.years);
  openDrawer(`<div class="kind">Keyword probe (example)</div><h2>${esc(p.label)}</h2><p class="meta">${esc(p.terms.join(" · "))}</p>
    ${facts([[fmt(p.uoa_all), `UoA publications ${yl}, all research (Scopus)`], [fmt(p.uoa_pac), "UoA, naming the Pacific"], [fmt(p.world_pac), "world, naming the Pacific"], [p.share == null ? "–" : p.share.toFixed(1) + "%", "UoA share"],
      [p.n_u ? pct(p.in_u, p.n_u) + "%" : "–", `of UoA's ${fmt(p.n_u)} Pacific papers are in the SRA dataset`], [p.n_w ? pct(p.in_w, p.n_w) + "%" : "–", `of the ${fmt(p.n_w)} most relevant world papers are`]])}
    <h3>SciVal Topics these papers belong to</h3><ul class="list">${p.topics.map(t => `<li>${t.ix >= 0 ? `<button data-svt="${t.ix}">` : "<div style='padding:5px 6px'>"}${esc(t.name)}<small>${ST[t.st]} · ${t.w} of the world sample · ${t.u} of UoA's · UoA output ${fmt(t.uoa)} (2021–25)</small>${t.ix >= 0 ? "</button>" : "</div>"}</li>`).join("") || "<li class='muted'>No papers found.</li>"}</ul>
    <h3>Works in this atlas matching the terms</h3><ul class="list">${p.works.slice(0, 20).map(workItem).join("") || "<li class='muted'>None.</li>"}</ul>
    ${elsSrc()}`);
}
function wireCommon(root) {
  root.querySelectorAll("[data-work]").forEach(b => b.onclick = () => openWork(+b.dataset.work));
  root.querySelectorAll("[data-author]").forEach(b => b.onclick = () => openAuthor(+b.dataset.author));
  root.querySelectorAll("[data-inst]").forEach(b => b.onclick = () => openInst(+b.dataset.inst));
  root.querySelectorAll("[data-place]").forEach(b => b.onclick = () => openPlace(b.dataset.place));
  root.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => openTopic(+b.dataset.topic));
  root.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => openSubfield(b.dataset.sub));
  root.querySelectorAll("[data-sv]").forEach(b => b.onclick = () => openSV(+b.dataset.sv));
  root.querySelectorAll("[data-svt]").forEach(b => b.onclick = () => openSVT(+b.dataset.svt));
  root.querySelectorAll("[data-award]").forEach(b => b.onclick = () => openAward(+b.dataset.award));
  root.querySelectorAll("[data-probe]").forEach(b => b.onclick = () => openProbe(+b.dataset.probe));
}
document.addEventListener("keydown", e => { if (e.key === "Escape") drawer.hidden = true; });

// ================================================================== SEARCH
const idxA = A.map(a => fold(a.name)), idxW = W.map(w => fold(w.t)), idxT = T.map(t => fold(t.name)), idxI = I.map(i => fold(i.name));
$("q").addEventListener("input", e => {
  const q = fold(e.target.value.trim()), R = $("results");
  if (q.length < 2) { R.hidden = true; return; }
  const pick = (idx, n) => { const out = []; for (let k = 0; k < idx.length && out.length < n; k++) if (idx[k].includes(q)) out.push(k); return out; };
  const ma = pick(idxA, 40).sort((x, y) => A[y].n - A[x].n).slice(0, 6), mt = pick(idxT, 20).slice(0, 4), mi = pick(idxI, 20).filter(i => i !== D.uoa_inst).sort((x, y) => I[y].n - I[x].n).slice(0, 4), mw = pick(idxW, 60).sort(byCites).slice(0, 6);
  let h = "";
  if (ma.length) h += `<h4>Researchers</h4>` + ma.map(a => `<button data-author="${a}">${esc(A[a].name)} <small>· ${esc(A[a].faculty || "")} · ${fmt(A[a].n)} works</small></button>`).join("");
  if (mt.length) h += `<h4>Topics</h4>` + mt.map(t => `<button data-topic="${t}">${esc(T[t].name)}</button>`).join("");
  if (mi.length) h += `<h4>Partner institutions</h4>` + mi.map(i => `<button data-inst="${i}">${esc(I[i].name)} <small>· ${esc(I[i].cc || "")}</small></button>`).join("");
  if (mw.length) h += `<h4>Works</h4>` + mw.map(i => `<button data-work="${i}">${esc(W[i].t.slice(0, 90))} <small>· ${W[i].y}</small></button>`).join("");
  R.innerHTML = h || "<h4>No matches</h4>"; R.hidden = false; wireCommon(R);
  R.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { R.hidden = true; }));
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("results").hidden = true; });

// ================================================================== BOOT
try { await document.fonts.load('600 14px "Source Sans 3"'); await document.fonts.load('400 14px "Source Sans 3"'); } catch { /* fallback */ }
$("loading").remove();
window.addEventListener("resize", () => { if (view === "map") relabel(); });
const start = (location.hash || "").replace("#", "");
recompute(); renderFilters();
setView(VIEWS.includes(start) ? start : "overview");
update();
})();
</script>
